<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche & Édition de Contact</title>
  <!-- Grist API -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
      color: #333;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 6px 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    .btn-save { background-color: #0b57d0; color: #fff; }
    .btn-cancel { background-color: #f1f3f4; color: #333; }
  </style>
</head>
<body>

  <!-- MODALE D'ÉDITION -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Éditer le contact</h3>
      
      <form id="editForm">
        <input type="hidden" id="recordId" />

        <div class="form-group">
          <label for="codePostal">Code Postal :</label>
          <input type="text" id="codePostal" name="Code_Postal" placeholder="ex: 93120" />
        </div>

        <div class="form-group">
          <label for="telPrincipal">Téléphone principal :</label>
          <input type="text" id="telPrincipal" name="Téléphone_Principal" />
        </div>

        <div class="form-group">
          <label for="telSecondaire">Téléphones secondaires :</label>
          <input type="text" id="telSecondaire" name="Téléphones_Secondaires" />
        </div>

        <div class="form-group">
          <label for="commentaire">Commentaire :</label>
          <textarea id="commentaire" name="Commentaire" rows="3"></textarea>
        </div>

        <div class="buttons">
          <button type="button" class="btn-cancel" onclick="closeModal()">Annuler</button>
          <button type="button" class="btn-save" onclick="saveRecord()">Enregistrer les modifications</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentRecord = null;

    // Initialisation Grist API
    grist.ready({
      requiredAccess: 'full'
    });

    // Écoute de la sélection/ouverture de fiche dans Grist
    grist.onRecord(function(record) {
      currentRecord = record;
    });

    // Fonction pour ouvrir la modale (au double-clic ou clic sur "Modifier")
    function openModal(record) {
      if (!record) record = currentRecord;
      if (!record) return;

      document.getElementById('recordId').value = record.id;
      
      // Injection de la valeur du Code Postal
      document.getElementById('codePostal').value = record.Code_Postal || '';
      
      // Injection des autres champs si présents
      if (document.getElementById('telPrincipal')) {
        document.getElementById('telPrincipal').value = record.Téléphone_Principal || record.Telephone_Principal || '';
      }
      if (document.getElementById('telSecondaire')) {
        document.getElementById('telSecondaire').value = record.Téléphones_Secondaires || record.Telephones_Secondaires || '';
      }
      if (document.getElementById('commentaire')) {
        document.getElementById('commentaire').value = record.Commentaire || '';
      }

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    // Sauvegarde vers Grist
    async function saveRecord() {
      const recId = parseInt(document.getElementById('recordId').value, 10);
      if (!recId) return;

      // Construction de l'objet de mise à jour avec les ID Python exacts des colonnes
      const updatedFields = {
        id: recId,
        fields: {
          Code_Postal: document.getElementById('codePostal').value,
          Commentaire: document.getElementById('commentaire').value
        }
      };

      // Si vous gérez les Listes de Diffusion Cinéma dans la modale :
      // Utilisation explicite de l'ID technique Python 'Listes_Diffusion_Cinema' sans accents/espaces
      if (currentRecord && currentRecord.Listes_Diffusion_Cinema !== undefined) {
        updatedFields.fields.Listes_Diffusion_Cinema = currentRecord.Listes_Diffusion_Cinema;
      }

      try {
        await grist.docApi.applyUserActions([
          ['UpdateRecord', 'CONTACTS', recId, updatedFields.fields]
        ]);
        closeModal();
      } catch (err) {
        alert("Erreur lors de l'enregistrement : " + err.message);
      }
    }
  </script>
</body>
</html>
