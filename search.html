<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche & Navigation Contacts</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; font-size: 15.5px; }
    
    .search-card { background: #ffffff; border-radius: 10px; padding: 20px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 700; color: #1f2937; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .count-badge { background: #e6f4ff; color: #0958d9; font-size: 15.5px; padding: 4px 10px; border-radius: 12px; font-weight: 600; }

    .filter-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    .filter-row-bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .checkboxes-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

    .field-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 13.5px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], select, textarea { padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15.5px; outline: none; background-color: #fff; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
    
    .checkbox-group { border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 11px; background-color: #f9fafb; display: flex; flex-direction: column; gap: 6px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: #374151; cursor: pointer; }
    .checkbox-item input[type="checkbox"] { transform: scale(1.1); }

    .actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; align-items: center; }
    .btn-search { background-color: #1677ff; color: white; border: none; padding: 11px 22px; font-size: 16.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-reset { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 11px 19px; font-size: 16.5px; font-weight: 600; border-radius: 6px; cursor: pointer; }

    .table-toolbar { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 11px 14px; border: 1px solid #e5e7eb; border-bottom: none; border-radius: 8px 8px 0 0; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
    .toolbar-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    
    .btn-tool { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 7px 13px; font-size: 15.5px; font-weight: bold; cursor: pointer; color: #374151; }
    .btn-tool:hover { background: #e5e7eb; }
    
    .btn-copy { background-color: #7c3aed; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-export { background-color: #10b981; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-csv { background-color: #0284c7; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }

    .table-container { max-height: 65vh; overflow-y: auto; overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 0 0 8px 8px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    table { width: 100%; border-collapse: collapse; font-size: 15.5px; text-align: left; table-layout: fixed; }
    th { background-color: #f3f4f6; color: #374151; padding: 13px 11px; position: sticky; top: 0; border-bottom: 1px solid #d1d5db; z-index: 5; user-select: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td { padding: 12px 11px; border-bottom: 1px solid #f9fafb; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr.result-row { cursor: pointer; }
    tr.result-row:hover { background-color: #f0fdf4; }
    tr.selected { background-color: #bae0ff !important; font-weight: 600; }

    .btn-action-modifier { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 4px 10px; font-size: 13.5px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-action-modifier:hover { background-color: #bae6fd; }

    .resizer { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; z-index: 10; }
    .resizer:hover, .resizer.resizing { background-color: #1677ff; }

    /* MODALE INTERNE */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
    .modal-card { background: #fff; border-radius: 12px; width: 92%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid #e5e7eb; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; margin-bottom: 16px; }
    .modal-title { font-size: 20px; font-weight: bold; color: #111827; }
    .btn-close { background: #f3f4f6; border: none; font-size: 20px; font-weight: bold; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; color: #6b7280; }
    
    .viewer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .viewer-field { display: flex; flex-direction: column; background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; }
    .viewer-field.full { grid-column: span 2; }
    .viewer-label { font-size: 12px; font-weight: bold; color: #6b7280; text-transform: uppercase; margin-bottom: 4px; }
    .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #e5e7eb; padding-top: 14px; }
    
    .error-input { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    .error-msg { font-size: 12px; color: #ef4444; margin-top: 3px; display: none; }
  </style>
</head>
<body>

  <!-- RECHERCHE & FILTRES -->
  <div class="search-card">
    <div class="card-title">
      <span>🔍 Recherche Multi-critères</span>
      <span id="result-count" class="count-badge">Chargement...</span>
    </div>

    <div class="filter-row">
      <div class="field-group">
        <label>Recherche Texte</label>
        <input type="text" id="filter-text" placeholder="Nom, prénom, structure, ville, email..." oninput="appliquerFiltres()">
      </div>

      <div class="field-group">
        <label>Service (Origine)</label>
        <select id="filter-service" onchange="appliquerFiltres()">
          <option value="">-- Tous les services --</option>
        </select>
      </div>

      <div class="field-group">
        <label>Statut Juridique</label>
        <select id="filter-statut" onchange="appliquerFiltres()">
          <option value="">-- Tous les statuts --</option>
        </select>
      </div>
    </div>

    <div class="filter-row-bottom">
      <div class="field-group">
        <label>Type de structure</label>
        <select id="filter-type-structure" onchange="appliquerFiltres()">
          <option value="">-- Tous les types --</option>
        </select>
      </div>

      <div class="field-group">
        <label>Fonction / Profession</label>
        <input type="text" id="filter-fonction" placeholder="Filtrer fonction..." oninput="appliquerFiltres()">
      </div>

      <div class="field-group">
        <label>Domaine d'activités</label>
        <select id="filter-domaine" onchange="appliquerFiltres()">
          <option value="">-- Tous les domaines --</option>
        </select>
      </div>
    </div>

    <div class="checkboxes-container" id="filter-checkboxes-container">
      <!-- Généré dynamiquement selon les droits utilisateur -->
    </div>

    <div class="actions">
      <button class="btn-reset" onclick="reinitialiserFiltres()">Réinitialiser</button>
      <button class="btn-search" onclick="appliquerFiltres()">Rechercher</button>
    </div>
  </div>

  <!-- BARRE D'OUTILS -->
  <div class="table-toolbar">
    <div class="toolbar-group">
      <button class="btn-tool" onclick="naviguerTableau(-1)">▲ Précédent</button>
      <button class="btn-tool" onclick="naviguerTableau(1)">▼ Suivant</button>
      <span style="border-left: 1px solid #d1d5db; height: 18px; margin: 0 6px;"></span>
      <button class="btn-tool" onclick="changerZoom(-1)">🔍 -</button>
      <button class="btn-tool" onclick="changerZoom(1)">🔍 +</button>
      <span style="font-size: 14.5px; color: #6b7280; margin-left: 8px;"><i>(Double-clic sur une ligne pour modifier la fiche)</i></span>
    </div>

    <div class="toolbar-group">
      <button class="btn-copy" onclick="copierEmails()">📋 Copier les emails (;)</button>
      <button class="btn-export" onclick="exporterEmailsTXT()">📥 Exporter Lots TXT</button>
      <button class="btn-csv" onclick="exporterCSV()">📥 Exporter (.csv)</button>
    </div>
  </div>

  <!-- TABLEAU DE RESULTATS -->
  <div class="table-container">
    <table id="main-table">
      <colgroup>
        <col style="width: 120px;">
        <col style="width: 120px;">
        <col style="width: 180px;">
        <col style="width: 110px;">
        <col style="width: 110px;">
        <col style="width: 180px;">
        <col style="width: 130px;">
      </colgroup>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Structure</th>
          <th>Service</th>
          <th>Ville</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="results-table-body">
        <!-- Rempli en JS -->
      </tbody>
    </table>
  </div>

  <!-- MODALE INTERNE DE MODIFICATION -->
  <div class="modal-overlay" id="modal-overlay" onclick="fermerModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">Modifier le contact</span>
        <button class="btn-close" onclick="fermerModal()">×</button>
      </div>
      <div class="viewer-grid" id="modal-content">
        <!-- Rempli dynamiquement -->
      </div>
      <div class="modal-footer">
        <button class="btn-reset" onclick="fermerModal()">Annuler</button>
        <button class="btn-search" onclick="sauvegarderContactModifie()">Enregistrer les modifications</button>
      </div>
    </div>
  </div>

  <script>
    let allRecords = [];
    let matchingRecords = [];
    let currentUserEmail = "";
    let currentUserProfile = "Direction"; // Par défaut si non trouvé
    let selectedIndex = 0;
    let currentFontSize = 15.5;
    let currentEditingId = null;

    grist.ready({ requiredAccess: 'full', parse: true });

    // Récupération des tables (Contacts et Utilisateurs)
    Promise.all([
      grist.docApi.fetchTable('UTILISATEURS'),
      grist.listSelectedTable() // ou on écoute les enregistrements de Contacts
    ]).then(([utilisateurs]) => {
      // Identifier l'utilisateur connecté via grist.user
      grist.user.getCurrentUser().then(user => {
        currentUserEmail = user ? user.email : "";
        
        // Chercher le service dans la table UTILISATEURS
        const matchUser = utilisateurs.find(u => u.Email && u.Email.toLowerCase() === currentUserEmail.toLowerCase());
        if (matchUser && matchUser.Service) {
          currentUserProfile = matchUser.Service; // "Direction", "Cinéma", "Houdremont"
        }
        
        initialiserInterfaceFiltresListes();
      });
    }).catch(err => {
      console.log("Erreur initialisation multi-table, mode repli Direction :", err);
      initialiserInterfaceFiltresListes();
    });

    grist.onRecords(function(records) {
      allRecords = records;
      peuplerListesDeroulantesFiltres();
      appliquerFiltres();
    });

    // Définition des listes de diffusion et filtrage selon le profil utilisateur
    function getListesDiffusionVisibles() {
      const toutesLesListes = [
        { cat: "Diffusion Cinéma", items: ["Crèche", "Enfance & Jeunesse", "Enseignant élémentaire", "Enseignant maternelle"] },
        { cat: "Diffusion DCP", items: ["EAC", "Arts visuels", "Patrimoine & Archives"] },
        { cat: "Diffusion Houdremont", items: ["Houdremont 1", "Houdremont 2"] } // Adaptez vos items Houdremont réels si besoin
      ];

      if (currentUserProfile === "Cinéma") {
        return toutesLesListes.filter(l => l.cat === "Diffusion Cinéma" || l.cat === "Diffusion DCP");
      } else if (currentUserProfile === "Houdremont") {
        return toutesLesListes.filter(l => l.cat === "Diffusion Houdremont");
      }
      return toutesLesListes; // Direction voit tout
    }

    function initialiserInterfaceFiltresListes() {
      const container = document.getElementById('filter-checkboxes-container');
      const listes = getListesDiffusionVisibles();
      
      container.innerHTML = listes.map(group => `
        <div class="field-group">
          <label>${group.cat}</label>
          <div class="checkbox-group" id="group-${group.cat.replace(/\s+/g, '-').toLowerCase()}">
            ${group.items.map(item => `<label class="checkbox-item"><input type="checkbox" value="${item}" onchange="appliquerFiltres()"> ${item}</label>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function normaliserChaine(valeur) {
      if (!valeur) return "";
      if (typeof valeur === "string") return valeur;
      if (Array.isArray(valeur)) {
        return valeur.map(v => typeof v === 'object' ? JSON.stringify(v) : String(v)).join(", ");
      }
      if (typeof valeur === "object") return JSON.stringify(valeur);
      return String(valeur);
    }

    function contientCritere(champData, valeurRecherchee) {
      const texteChamp = normaliserChaine(champData).toLowerCase();
      return texteChamp.includes(valeurRecherchee.toLowerCase());
    }

    function extraireValeursUniques(cle) {
      const valeursSet = new Set();
      allRecords.forEach(r => {
        const val = r[cle];
        if (val !== undefined && val !== null && val !== "") {
          const texte = normaliserChaine(val);
          texte.split(/[,;]/).forEach(v => {
            const clean = v.trim();
            if (clean) valeursSet.add(clean);
          });
        }
      });
      return Array.from(valeursSet).sort();
    }

    function peuplerListesDeroulantesFiltres() {
      const services = extraireValeursUniques('Service');
      const selService = document.getElementById('filter-service');
      if(selService) {
        const valServiceActuelle = selService.value;
        selService.innerHTML = '<option value="">-- Tous les services --</option>' + services.map(s => `<option value="${s}">${s}</option>`).join('');
        selService.value = valServiceActuelle;
      }

      const statuts = extraireValeursUniques('STATUT_JURIDIQUE');
      const selStatut = document.getElementById('filter-statut');
      if(selStatut) {
        const valStatutActuelle = selStatut.value;
        selStatut.innerHTML = '<option value="">-- Tous les statuts --</option>' + statuts.map(s => `<option value="${s}">${s}</option>`).join('');
        selStatut.value = valStatutActuelle;
      }

      const typesStruct = extraireValeursUniques('TYPE_DE_STRUCTURE_CONTACT').length > 0 ? extraireValeursUniques('TYPE_DE_STRUCTURE_CONTACT') : extraireValeursUniques('TYPE_DE_STRUCTURE');
      const selTypeStruct = document.getElementById('filter-type-structure');
      if(selTypeStruct) {
        const valTypeStructActuelle = selTypeStruct.value;
        selTypeStruct.innerHTML = '<option value="">-- Tous les types --</option>' + typesStruct.map(t => `<option value="${t}">${t}</option>`).join('');
        selTypeStruct.value = valTypeStructActuelle;
      }

      const domaines = extraireValeursUniques('DOMAINE_D_ACTIVITES');
      const selDomaine = document.getElementById('filter-domaine');
      if(selDomaine) {
        const valDomaineActuelle = selDomaine.value;
        selDomaine.innerHTML = '<option value="">-- Tous les domaines --</option>' + domaines.map(d => `<option value="${d}">${d}</option>`).join('');
        selDomaine.value = valDomaineActuelle;
      }
    }

    function appliquerFiltres() {
      if (!allRecords || allRecords.length === 0) return;

      const textFilter = document.getElementById('filter-text').value.toLowerCase().trim();
      const serviceFilter = document.getElementById('filter-service').value;
      const statutFilter = document.getElementById('filter-statut').value;
      const typeStructFilter = document.getElementById('filter-type-structure').value;
      const fonctionFilter = document.getElementById('filter-fonction').value.toLowerCase().trim();
      const domaineFilter = document.getElementById('filter-domaine').value;

      matchingRecords = allRecords.filter(rec => {
        if (textFilter) {
          const champsCibles = [
            rec.NOM, rec.PRENOM, rec.NOM_Structure, rec.Ville, rec.Code_Postal,
            rec.EMAIL_PRINCIPAL, rec.EMAILS_SECONDAIRES, rec.Telephone_Principal, 
            rec.Telephones_Secondaires, rec.Fonction_Profession, rec.Commentaire_Description
          ];
          const texteGlobal = champsCibles.map(c => normaliserChaine(c)).join(' ').toLowerCase();
          const motsRecherche = textFilter.split(/\s+/);
          if (!motsRecherche.every(mot => texteGlobal.includes(mot))) return false;
        }

        if (serviceFilter && !contientCritere(rec.Service, serviceFilter)) return false;
        if (statutFilter && !contientCritere(rec.STATUT_JURIDIQUE, statutFilter)) return false;
        if (domaineFilter && !contientCritere(rec.DOMAINE_D_ACTIVITES, domaineFilter)) return false;

        if (typeStructFilter) {
          const valTypeStruct = normaliserChaine(rec.TYPE_DE_STRUCTURE_CONTACT || rec.TYPE_DE_STRUCTURE);
          if (!valTypeStruct.toLowerCase().includes(typeStructFilter.toLowerCase())) return false;
        }

        if (fonctionFilter) {
          const valFonction = normaliserChaine(rec.Fonction_Profession || rec.Fonction);
          if (!valFonction.toLowerCase().includes(fonctionFilter)) return false;
        }

        // Vérification dynamique des checkboxes visibles selon profil
        const listesVisibles = getListesDiffusionVisibles();
        for (let group of listesVisibles) {
          const groupId = 'group-' + group.cat.replace(/\s+/g, '-').toLowerCase();
          const containerElem = document.getElementById(groupId);
          if (containerElem) {
            const checkedInputs = Array.from(containerElem.querySelectorAll('input:checked')).map(cb => cb.value);
            if (checkedInputs.length > 0) {
              const valRec = rec[group.cat.replace(/\s+/g, '_')] || rec.Listes_Diffusion_Cinema;
              const match = checkedInputs.some(val => contientCritere(valRec, val));
              if (!match) return false;
            }
          }
        }

        return true;
      });

      document.getElementById('result-count').innerText = `${matchingRecords.length} / ${allRecords.length} résultat(s)`;
      selectedIndex = 0;
      afficherTableau();
    }

    function afficherTableau() {
      const tbody = document.getElementById('results-table-body');
      tbody.innerHTML = '';

      matchingRecords.forEach((rec, index) => {
        const tr = document.createElement('tr');
        tr.className = 'result-row';
        if (index === selectedIndex) tr.classList.add('selected');

        tr.innerHTML = `
          <td>${rec.NOM || ''}</td>
          <td>${rec.PRENOM || ''}</td>
          <td>${rec.NOM_Structure || ''}</td>
          <td>${normaliserChaine(rec.Service)}</td>
          <td>${rec.Ville || ''}</td>
          <td>${rec.EMAIL_PRINCIPAL || ''}</td>
          <td><button class="btn-action-modifier">Modifier</button></td>
        `;

        tr.querySelector('.btn-action-modifier').onclick = (e) => {
          e.stopPropagation();
          selectedIndex = index;
          majSelectionGraphique();
          ouvrirModal(rec);
        };

        tr.onclick = () => { selectedIndex = index; majSelectionGraphique(); };
        tr.ondblclick = () => { selectedIndex = index; majSelectionGraphique(); ouvrirModal(rec); };

        tbody.appendChild(tr);
      });
    }

    function majSelectionGraphique() {
      document.querySelectorAll('#results-table-body tr').forEach((row, idx) => {
        row.classList.toggle('selected', idx === selectedIndex);
      });
    }

    function naviguerTableau(dir) {
      const newIndex = selectedIndex + dir;
      if (newIndex >= 0 && newIndex < matchingRecords.length) {
        selectedIndex = newIndex;
        majSelectionGraphique();
        const rows = document.querySelectorAll('#results-table-body tr');
        if (rows[selectedIndex]) rows[selectedIndex].scrollIntoView({ block: 'nearest' });
      }
    }

    function changerZoom(delta) {
      currentFontSize = Math.max(11, Math.min(24, currentFontSize + delta));
      document.getElementById('main-table').style.fontSize = `${currentFontSize}px`;
    }

    function genererOptionsSelect(listeValeurs, valeurActuelle) {
      let options = '<option value="">-- Sélectionner --</option>';
      const valStr = (valeurActuelle !== null && valeurActuelle !== undefined) ? String(valeurActuelle) : "";
      listeValeurs.forEach(item => {
        const idVal = (typeof item === 'object' && item !== null) ? item.id : item;
        const libelle = (typeof item === 'object' && item !== null) ? (item.label || item.NOM || item.Name) : String(item);
        const selected = (String(idVal) === valStr || String(libelle) === valStr) ? 'selected' : '';
        options += `<option value="${idVal}" ${selected}>${libelle}</option>`;
      });
      return options;
    }

    function ouvrirModal(rec) {
      currentEditingId = rec.id;
      const servicesDispos = extraireValeursUniques('Service');
      const statutsDispos = extraireValeursUniques('STATUT_JURIDIQUE');
      const typesStructDispos = extraireValeursUniques('TYPE_DE_STRUCTURE_CONTACT').length > 0 ? extraireValeursUniques('TYPE_DE_STRUCTURE_CONTACT') : extraireValeursUniques('TYPE_DE_STRUCTURE');
      const domainesDispos = extraireValeursUniques('DOMAINE_D_ACTIVITES');

      document.getElementById('modal-content').innerHTML = `
        <div class="viewer-field"><span class="viewer-label">Nom</span><input type="text" id="edit-nom" value="${rec.NOM || ''}"></div>
        <div class="viewer-field"><span class="viewer-label">Prénom</span><input type="text" id="edit-prenom" value="${rec.PRENOM || ''}"></div>
        <div class="viewer-field"><span class="viewer-label">Service</span><select id="edit-service">${genererOptionsSelect(servicesDispos, rec.Service)}</select></div>
        <div class="viewer-field"><span class="viewer-label">Type de structure</span><select id="edit-type-structure">${genererOptionsSelect(typesStructDispos, rec.TYPE_DE_STRUCTURE_CONTACT || rec.TYPE_DE_STRUCTURE)}</select></div>
        <div class="viewer-field"><span class="viewer-label">Statut Juridique</span><select id="edit-statut">${genererOptionsSelect(statutsDispos, rec.STATUT_JURIDIQUE)}</select></div>
        <div class="viewer-field"><span class="viewer-label">Domaine d'activités</span><select id="edit-domaine">${genererOptionsSelect(domainesDispos, rec.DOMAINE_D_ACTIVITES)}</select></div>
        <div class="viewer-field"><span class="viewer-label">Fonction / Profession</span><input type="text" id="edit-fonction" value="${rec.Fonction_Profession || ''}"></div>
        <div class="viewer-field"><span class="viewer-label">Email Principal</span><input type="text" id="edit-email" value="${rec.EMAIL_PRINCIPAL || ''}"></div>
        <div class="viewer-field"><span class="viewer-label">Emails Secondaires</span><input type="text" id="edit-emails-sec" value="${normaliserChaine(rec.EMAILS_SECONDAIRES)}"></div>
        <div class="viewer-field"><span class="viewer-label">Téléphone Principal</span><input type="text" id="edit-tel" value="${rec.Telephone_Principal || ''}"></div>
        <div class="viewer-field"><span class="viewer-label">Téléphones Secondaires</span><input type="text" id="edit-tel-sec" value="${normaliserChaine(rec.Telephones_Secondaires)}"></div>
        <div class="viewer-field"><span class="viewer-label">Ville</span><input type="text" id="edit-ville" value="${rec.Ville || ''}"></div>
        <div class="viewer-field full"><span class="viewer-label">Commentaire</span><textarea id="edit-commentaire" rows="2">${rec.Commentaire_Description || ''}</textarea></div>
      `;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function fermerModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      currentEditingId = null;
    }

    function convertirValeurReference(valeurBrute) {
      if (!valeurBrute) return null;
      if (!isNaN(valeurBrute) && String(valeurBrute).trim() !== "") return Number(valeurBrute);
      return valeurBrute;
    }

    async function sauvegarderContactModifie() {
      if (!currentEditingId) return;
      const champsModifies = {
        NOM: document.getElementById('edit-nom').value,
        PRENOM: document.getElementById('edit-prenom').value,
        Service: convertirValeurReference(document.getElementById('edit-service').value),
        TYPE_DE_STRUCTURE_CONTACT: convertirValeurReference(document.getElementById('edit-type-structure').value),
        STATUT_JURIDIQUE: convertirValeurReference(document.getElementById('edit-statut').value),
        DOMAINE_D_ACTIVITES: convertirValeurReference(document.getElementById('edit-domaine').value),
        Fonction_Profession: document.getElementById('edit-fonction').value,
        EMAIL_PRINCIPAL: document.getElementById('edit-email').value.trim(),
        EMAILS_SECONDAIRES: document.getElementById('edit-emails-sec').value.trim(),
        Telephone_Principal: document.getElementById('edit-tel').value,
        Telephones_Secondaires: document.getElementById('edit-tel-sec').value,
        Ville: document.getElementById('edit-ville').value,
        Commentaire_Description: document.getElementById('edit-commentaire').value
      };
      try {
        await grist.selectedTable.update({ id: currentEditingId, fields: champsModifies });
        fermerModal();
      } catch (err) {
        alert("Erreur lors de l'enregistrement : " + err.message);
      }
    }

    function collecterTousLesEmails() {
      let listeEmails = [];
      matchingRecords.forEach(r => {
        if (r.EMAIL_PRINCIPAL && r.EMAIL_PRINCIPAL.trim().length > 0) listeEmails.push(r.EMAIL_PRINCIPAL.trim());
        if (r.EMAILS_SECONDAIRES) {
          normaliserChaine(r.EMAILS_SECONDAIRES).split(/[,;]/).forEach(e => {
            if (e.trim().length > 0) listeEmails.push(e.trim());
          });
        }
      });
      return Array.from(new Set(listeEmails));
    }

    function copierEmails() {
      const listeEmails = collecterTousLesEmails();
      if (listeEmails.length === 0) { alert("Aucune adresse e-mail."); return; }
      navigator.clipboard.writeText(listeEmails.join('; ')).then(() => alert(`✅ ${listeEmails.length} e-mails copiés !`));
    }

    function exporterEmailsTXT() {
      const listeEmails = collecterTousLesEmails();
      if (listeEmails.length === 0) return;
      let contenuFichier = "";
      let lotCompteur = 1;
      for (let i = 0; i < listeEmails.length; i += 30) {
        contenuFichier += `--- Envoi ${lotCompteur} ---\n` + listeEmails.slice(i, i + 30).join('; ') + "\n\n";
        lotCompteur++;
      }
      const blob = new Blob([contenuFichier], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `emails_par_lots.txt`;
      link.click();
    }

    function exporterCSV() {
      if (matchingRecords.length === 0) return;
      const entetes = ["Nom", "Prénom", "Service", "Statut Juridique", "Domaine", "Ville", "Email Principal"];
      let csvContent = "\uFEFF" + entetes.join(";") + "\n";
      matchingRecords.forEach(r => {
        const ligne = [r.NOM||'', r.PRENOM||'', normaliserChaine(r.Service), normaliserChaine(r.STATUT_JURIDIQUE), normaliserChaine(r.DOMAINE_D_ACTIVITES), r.Ville||'', r.EMAIL_PRINCIPAL||''];
        csvContent += ligne.map(val => `"${String(val).replace(/"/g, '""')}"`).join(";") + "\n";
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `contacts_export.csv`;
      link.click();
    }
    
    function reinitialiserFiltres() {
      document.getElementById('filter-text').value = '';
      document.getElementById('filter-service').value = '';
      document.getElementById('filter-statut').value = '';
      document.getElementById('filter-type-structure').value = '';
      document.getElementById('filter-fonction').value = '';
      document.getElementById('filter-domaine').value = '';
      document.querySelectorAll('.checkbox-group input[type="checkbox"]').forEach(cb => cb.checked = false);
      appliquerFiltres();
    }
  </script>
</body>
</html>
