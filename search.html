<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion Contacts Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; font-size: 15.5px; }
    
    .search-card { background: #ffffff; border-radius: 10px; padding: 20px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 700; color: #1f2937; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .count-badge { background: #e6f4ff; color: #0958d9; font-size: 15.5px; padding: 4px 10px; border-radius: 12px; font-weight: 600; }

    .filter-row, .filter-row-bottom { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    .checkboxes-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }

    .field-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 13.5px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], input[type="email"], select, textarea { padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15.5px; outline: none; background-color: #fff; width: 100%; transition: all 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
    
    input.invalid-email { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    input.valid-email { border-color: #10b981 !important; background-color: #f0fdf4 !important; }
    .email-msg { font-size: 11.5px; margin-top: 2px; font-weight: 600; }
    .email-msg.error { color: #dc2626; }
    .email-msg.success { color: #16a34a; }

    .checkbox-group { border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 11px; background-color: #f9fafb; display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: #374151; cursor: pointer; }
    .checkbox-item input[type="checkbox"] { transform: scale(1.1); cursor: pointer; }

    .actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; align-items: center; }
    .btn-search { background-color: #1677ff; color: white; border: none; padding: 11px 22px; font-size: 16.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-reset { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 11px 19px; font-size: 16.5px; font-weight: 600; border-radius: 6px; cursor: pointer; }

    .table-toolbar { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 11px 14px; border: 1px solid #e5e7eb; border-bottom: none; border-radius: 8px 8px 0 0; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
    .toolbar-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    
    .btn-tool { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 7px 13px; font-size: 15.5px; font-weight: bold; cursor: pointer; color: #374151; }
    .btn-tool:hover { background: #e5e7eb; }
    
    .btn-export { background-color: #10b981; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-csv { background-color: #0284c7; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-copy { background-color: #8b5cf6; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-selected-txt { background-color: #d97706; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-selected-csv { background-color: #0d9488; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }

    .table-container { max-height: 65vh; overflow-y: auto; overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 0 0 8px 8px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    table { width: 100%; border-collapse: collapse; font-size: 15.5px; text-align: left; table-layout: fixed; }
    th { background-color: #f3f4f6; color: #374151; padding: 13px 11px; position: sticky; top: 0; border-bottom: 1px solid #d1d5db; z-index: 5; user-select: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    th.no-sort { cursor: default; }
    th:hover:not(.no-sort) { background-color: #e5e7eb; }
    td { padding: 12px 11px; border-bottom: 1px solid #f9fafb; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: none; }
    tr.result-row { cursor: pointer; }
    tr.result-row:hover { background-color: #f0fdf4; }
    tr.selected { background-color: #e6f4ff !important; }
    tr.checked-row { background-color: #bae0ff !important; font-weight: 500; }

    .btn-action-modifier { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 4px 10px; font-size: 13.5px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-action-modifier:hover { background-color: #bae6fd; }

    .sort-icon { font-size: 12px; margin-left: 4px; color: #6b7280; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
    .modal-card { background: #fff; border-radius: 12px; width: 95%; max-width: 950px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid #e5e7eb; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; margin-bottom: 16px; }
    .modal-title { font-size: 20px; font-weight: bold; color: #111827; }
    .btn-close { background: #f3f4f6; border: none; font-size: 20px; font-weight: bold; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; color: #6b7280; }
    
    .viewer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .viewer-field { display: flex; flex-direction: column; background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; }
    .viewer-field.full { grid-column: span 2; }
    .viewer-label { font-size: 12px; font-weight: bold; color: #6b7280; text-transform: uppercase; margin-bottom: 4px; }
    
    .modal-section-title { grid-column: span 2; font-size: 16px; font-weight: bold; color: #1677ff; margin-top: 14px; padding-bottom: 4px; border-bottom: 2px solid #e5e7eb; }
    .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #e5e7eb; padding-top: 14px; }
  </style>
</head>
<body>

  <div class="search-card">
    <div class="card-title">
      <span>🔍 Recherche Multi-critères</span>
      <span id="result-count" class="count-badge">Chargement...</span>
    </div>

    <div class="filter-row">
      <div class="field-group">
        <label>Recherche Texte</label>
        <input type="text" id="filter-text" placeholder="Nom, prénom, structure, ville, email..." oninput="appliquerFiltres()">
      </div>
      <div class="field-group">
        <label>Service (Origine)</label>
        <select id="filter-service" onchange="appliquerFiltres()"><option value="">-- Tous les services --</option></select>
      </div>
      <div class="field-group">
        <label>Statut Juridique</label>
        <select id="filter-statut" onchange="appliquerFiltres()"><option value="">-- Tous les statuts --</option></select>
      </div>
    </div>

    <div class="filter-row-bottom">
      <div class="field-group">
        <label>Type de structure</label>
        <select id="filter-type-structure" onchange="appliquerFiltres()"><option value="">-- Tous les types --</option></select>
      </div>
      <div class="field-group">
        <label>Fonction / Profession</label>
        <input type="text" id="filter-fonction" placeholder="Filtrer fonction..." oninput="appliquerFiltres()">
      </div>
      <div class="field-group">
        <label>Domaine d'activités</label>
        <select id="filter-domaine" onchange="appliquerFiltres()"><option value="">-- Tous les domaines --</option></select>
      </div>
    </div>

    <div class="checkboxes-container">
      <div class="field-group">
        <label>Diffusion Cinéma</label>
        <div class="checkbox-group" id="group-cinema">
          <label class="checkbox-item"><input type="checkbox" value="Crèche" onchange="appliquerFiltres()"> Crèche</label>
          <label class="checkbox-item"><input type="checkbox" value="Enfance & Jeunesse" onchange="appliquerFiltres()"> Enfance & Jeunesse</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant élémentaire" onchange="appliquerFiltres()"> Enseignant élémentaire</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant maternelle" onchange="appliquerFiltres()"> Enseignant maternelle</label>
        </div>
      </div>

      <div class="field-group">
        <label>Diffusion Direction</label>
        <div class="checkbox-group" id="group-direction">
          <label class="checkbox-item"><input type="checkbox" value="Enseignants maternelle PEAC 26-27" onchange="appliquerFiltres()"> Enseignants maternelle PEAC 26-27</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignants élémentaire PEAC 26-27" onchange="appliquerFiltres()"> Enseignants élémentaire PEAC 26-27</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts visuels" onchange="appliquerFiltres()"> Arts visuels</label>
          <label class="checkbox-item"><input type="checkbox" value="Patrimoine & Archives" onchange="appliquerFiltres()"> Patrimoine & Archives</label>
          <label class="checkbox-item"><input type="checkbox" value="Newsletter" onchange="appliquerFiltres()"> Newsletter</label>
          <label class="checkbox-item"><input type="checkbox" value="DAC_93" onchange="appliquerFiltres()"> DAC_93</label>
        </div>
      </div>

      <div class="field-group">
        <label>Diffusion Houdremont</label>
        <div class="checkbox-group" id="group-houdremont">
          <label class="checkbox-item"><input type="checkbox" value="Crèche" onchange="appliquerFiltres()"> Crèche</label>
          <label class="checkbox-item"><input type="checkbox" value="Enfance & Jeunesse" onchange="appliquerFiltres()"> Enfance & Jeunesse</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant élémentaire" onchange="appliquerFiltres()"> Enseignant élémentaire</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant maternelle" onchange="appliquerFiltres()"> Enseignant maternelle</label>
          <label class="checkbox-item"><input type="checkbox" value="Habitants" onchange="appliquerFiltres()"> Habitants</label>
          <label class="checkbox-item"><input type="checkbox" value="Newsletter" onchange="appliquerFiltres()"> Newsletter</label>
        </div>
      </div>

      <div class="field-group">
        <label>Diffusion Intervenant</label>
        <div class="checkbox-group" id="group-intervenant">
          <label class="checkbox-item"><input type="checkbox" value="Cinéma" onchange="appliquerFiltres()"> Cinéma</label>
          <label class="checkbox-item"><input type="checkbox" value="PEAC 26-27" onchange="appliquerFiltres()"> PEAC 26-27</label>
          <label class="checkbox-item"><input type="checkbox" value="Patrimoine" onchange="appliquerFiltres()"> Patrimoine</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts visuels" onchange="appliquerFiltres()"> Arts visuels</label>
          <label class="checkbox-item"><input type="checkbox" value="Direction" onchange="appliquerFiltres()"> Direction</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts plastiques" onchange="appliquerFiltres()"> Arts plastiques</label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-reset" onclick="reinitialiserFiltres()">Réinitialiser</button>
      <button class="btn-search" onclick="appliquerFiltres()">Rechercher</button>
    </div>
  </div>

  <div class="table-toolbar">
    <div class="toolbar-group">
      <button class="btn-tool" onclick="naviguerTableau(-1)">▲ Précédent</button>
      <button class="btn-tool" onclick="naviguerTableau(1)">▼ Suivant</button>
      <span style="border-left: 1px solid #d1d5db; height: 18px; margin: 0 6px;"></span>
      <button class="btn-tool" onclick="changerZoom(-1)">🔍 -</button>
      <button class="btn-tool" onclick="changerZoom(1)">🔍 +</button>
      <span style="font-size: 13.5px; color: #6b7280; margin-left: 8px;"><i>(Shift+Clic : plage | Clic case : sélectionner | Double-clic : éditer)</i></span>
    </div>

    <div class="toolbar-group">
      <button class="btn-selected-txt" id="btn-export-selected-txt" style="display:none;" onclick="exporterMailsSelectionnesTXT()">📩 Exporter mails sélect. TXT</button>
      <button class="btn-selected-csv" id="btn-export-selected-csv" style="display:none;" onclick="exporterFichesSelectionneesCSV()">📄 Exporter fiches sélect. (.csv)</button>
      
      <button class="btn-copy" onclick="copierEmails()">📋 Copier les emails (;)</button>
      <button class="btn-export" onclick="exporterEmailsTXT()">📥 Exporter tous les mails TXT</button>
      <button class="btn-csv" onclick="exporterCSV()">📥 Exporter toutes les fiches (.csv)</button>
    </div>
  </div>

  <div class="table-container">
    <table id="main-table">
      <colgroup>
        <col style="width: 140px;">
        <col style="width: 140px;">
        <col style="width: 180px;">
        <col style="width: 130px;">
        <col style="width: 120px;">
        <col style="width: 200px;">
        <col style="width: 50px;">
        <col style="width: 90px;">
      </colgroup>
      <thead>
        <tr>
          <th onclick="trierTableau('NOM')">Nom <span class="sort-icon" id="sort-NOM">↕</span></th>
          <th onclick="trierTableau('PRENOM')">Prénom <span class="sort-icon" id="sort-PRENOM">↕</span></th>
          <th onclick="trierTableau('NOM_Structure')">Structure <span class="sort-icon" id="sort-NOM_Structure">↕</span></th>
          <th onclick="trierTableau('Service')">Service <span class="sort-icon" id="sort-Service">↕</span></th>
          <th onclick="trierTableau('Ville')">Ville <span class="sort-icon" id="sort-Ville">↕</span></th>
          <th onclick="trierTableau('EMAIL_PRINCIPAL')">Email <span class="sort-icon" id="sort-EMAIL_PRINCIPAL">↕</span></th>
          <th class="no-sort" style="text-align: center;"><input type="checkbox" id="select-all" onchange="toutSelectionner(this)" title="Tout sélectionner / Désélectionner"></th>
          <th class="no-sort">Action</th>
        </tr>
      </thead>
      <tbody id="results-table-body"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="fermerModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">Modifier la fiche contact</span>
        <button class="btn-close" onclick="fermerModal()">×</button>
      </div>
      <div class="viewer-grid" id="modal-content"></div>
      <div class="modal-footer">
        <button class="btn-reset" onclick="fermerModal()">Annuler</button>
        <button class="btn-search" onclick="sauvegarderContactModifie()">Enregistrer les modifications</button>
      </div>
    </div>
  </div>

  <script>
    let allRecords = [];
    let matchingRecords = [];
    let selectedIndex = 0;
    let lastClickedIndex = null;
    let currentFontSize = 15.5;
    let currentEditingRecord = null;

    let sortColumn = null;
    let sortAscending = true;
    let selectedIds = new Set();

    let referenceTables = { structures: [], services: [], statuts: [] };

    const KEYS = {
    NOM: ['NOM', 'Nom'],
    PRENOM: ['PRENOM', 'Prénom', 'Prenom'],
    STRUCTURE: ['NOM_Structure', 'NOM Structure', 'Structure', 'Structure_Contact', 'Nom_Structure'],
    FONCTION: ['Fonction_Profession', 'Fonction / Profession', 'Fonction'],
    SERVICE: ['Service', 'Service_Origine', 'Service (Origine)'],
    STATUT: ['STATUT_JURIDIQUE', 'Statut Juridique', 'Statut_Juridique'],
    TYPE_STRUCT: ['TYPE_DE_STRUCTURE_CONTACT', 'TYPE_DE_STRUCTURE', 'Type de structure', 'Type_de_structure'],
    DOMAINE: ['DOMAINE_D_ACTIVITES', 'Domaine d\'activités', 'Domaine_d_activites'],
    CODE_POSTAL: ['Code_Postal', 'Code Postal', 'CP'],
    VILLE: ['Ville', 'VILLE'],
    EMAIL_PRINCIPAL: ['EMAIL_PRINCIPAL', 'Email Principal', 'Email'],
    EMAILS_SECONDAIRES: ['EMAILS_SECONDAIRES', 'Emails Secondaires'],
    TEL_PRINCIPAL: ['Telephone_Principal', 'Téléphone Principal', 'Tel_Principal'],
    TELS_SECONDAIRES: ['Telephones_Secondaires', 'Téléphones Secondaires'],
    DIFF_CINEMA: ['Listes_Diffusion_Cinema', 'Listes Diffusion Cinéma', 'Diffusion Cinéma'],
    DIFF_DIRECTION: ['Listes_Diffusion_Direction', 'Listes Diffusion Direction', 'Diffusion Direction'],
    DIFF_HOUDREMONT: ['Listes_Diffusion_Houdremont', 'Listes Diffusion Houdremont', 'Diffusion Houdremont'],
    DIFF_INTERVENANT: ['Listes_Diffusion_Intervenants', 'Listes_Diffusion_Intervenant', 'Listes Diffusion Intervenant'],
    COMMENTAIRE: ['Commentaire_Description', 'Commentaire / Description', 'Commentaire']
};

    const OPTIONS_DIFFUSION = {
      CINEMA: ["Crèche", "Enfance & Jeunesse", "Enseignant élémentaire", "Enseignant maternelle"],
      DIRECTION: ["Enseignants maternelle PEAC 26-27", "Enseignants élémentaire PEAC 26-27", "Arts visuels", "Patrimoine & Archives", "Newsletter", "DAC_93"],
      HOUDREMONT: ["Crèche", "Enfance & Jeunesse", "Enseignant élémentaire", "Enseignant maternelle", "Habitants", "Newsletter"],
      INTERVENANT: ["Cinéma", "PEAC 26-27", "Patrimoine", "Arts visuels", "Direction", "Arts plastiques"]
    };

    grist.ready({ requiredAccess: 'full' });

    grist.onRecords(async function(records) {
      allRecords = records;
      await chargerTablesDeReference();
      peuplerListesDeroulantesFiltres();
      appliquerFiltres();
    });

    async function chargerTablesDeReference() {
      try {
        const fetchTable = async (name) => {
          try { return await grist.docApi.fetchTable(name); } catch(e) { return null; }
        };
        const tStruct = await fetchTable('STRUCTURES') || await fetchTable('Structures');
        if(tStruct) referenceTables.structures = tStruct.Nom || tStruct.NOM || tStruct.Name || [];
        const tServ = await fetchTable('SERVICES') || await fetchTable('Services');
        if(tServ) referenceTables.services = tServ.Nom || tServ.Service || [];
        const tStat = await fetchTable('STATUTS') || await fetchTable('Statuts');
        if(tStat) referenceTables.statuts = tStat.Nom || tStat.Statut || [];
      } catch(e) { console.warn("Erreur chargement tables de référence:", e); }
    }

    function getVal(rec, keys) {
      if (!rec) return "";
      for (let k of keys) {
        if (rec[k] !== undefined && rec[k] !== null) return rec[k];
      }
      return "";
    }

    function findExactExistingKey(rec, keys) {
      if (!rec) return keys[0];
      for (let k of keys) {
        if (k in rec) return k;
      }
      return keys[0];
    }

    function normaliserChaine(valeur) {
      if (!valeur) return "";
      if (typeof valeur === "string") return valeur;
      if (Array.isArray(valeur)) {
        return valeur.map(v => (typeof v === 'object' && v !== null && v.L) ? v.L : (typeof v === 'object' ? JSON.stringify(v) : String(v))).join(", ");
      }
      if (typeof valeur === "object") return valeur.L || JSON.stringify(valeur);
      return String(valeur);
    }

    function contientCritere(champData, valeurRecherchee) {
      return normaliserChaine(champData).toLowerCase().includes(valeurRecherchee.toLowerCase());
    }

    function extraireValeursUniques(cles) {
      const valeursSet = new Set();
      allRecords.forEach(r => {
        const val = getVal(r, cles);
        if (val) {
          normaliserChaine(val).split(/[,;]/).forEach(v => {
            const clean = v.trim();
            if (clean) valeursSet.add(clean);
          });
        }
      });
      return Array.from(valeursSet).sort();
    }

    function peuplerListesDeroulantesFiltres() {
      const alimenterSelect = (id, options) => {
        const sel = document.getElementById(id);
        const curVal = sel.value;
        sel.innerHTML = '<option value="">-- Tous --</option>' + options.map(s => `<option value="${s}">${s}</option>`).join('');
        sel.value = curVal;
      };
      alimenterSelect('filter-service', extraireValeursUniques(KEYS.SERVICE));
      alimenterSelect('filter-statut', extraireValeursUniques(KEYS.STATUT));
      alimenterSelect('filter-type-structure', extraireValeursUniques(KEYS.TYPE_STRUCT));
      alimenterSelect('filter-domaine', extraireValeursUniques(KEYS.DOMAINE));
    }

    function appliquerFiltres() {
      if (!allRecords.length) return;

      const textFilter = document.getElementById('filter-text').value.toLowerCase().trim();
      const serviceFilter = document.getElementById('filter-service').value;
      const statutFilter = document.getElementById('filter-statut').value;
      const typeStructFilter = document.getElementById('filter-type-structure').value;
      const fonctionFilter = document.getElementById('filter-fonction').value.toLowerCase().trim();
      const domaineFilter = document.getElementById('filter-domaine').value;

      const cinemaChecked = Array.from(document.querySelectorAll('#group-cinema input:checked')).map(cb => cb.value);
      const directionChecked = Array.from(document.querySelectorAll('#group-direction input:checked')).map(cb => cb.value);
      const houdremontChecked = Array.from(document.querySelectorAll('#group-houdremont input:checked')).map(cb => cb.value);
      const intervenantChecked = Array.from(document.querySelectorAll('#group-intervenant input:checked')).map(cb => cb.value);

      matchingRecords = allRecords.filter(rec => {
        if (textFilter) {
          const textGlobal = [
            getVal(rec, KEYS.NOM), getVal(rec, KEYS.PRENOM), getVal(rec, KEYS.STRUCTURE),
            getVal(rec, KEYS.VILLE), getVal(rec, KEYS.CODE_POSTAL), getVal(rec, KEYS.EMAIL_PRINCIPAL),
            getVal(rec, KEYS.EMAILS_SECONDAIRES), getVal(rec, KEYS.TEL_PRINCIPAL), getVal(rec, KEYS.TELS_SECONDAIRES),
            getVal(rec, KEYS.FONCTION), getVal(rec, KEYS.COMMENTAIRE)
          ].map(c => normaliserChaine(c)).join(' ').toLowerCase();

          if (!textFilter.split(/\s+/).every(m => textGlobal.includes(m))) return false;
        }

        if (serviceFilter && !contientCritere(getVal(rec, KEYS.SERVICE), serviceFilter)) return false;
        if (statutFilter && !contientCritere(getVal(rec, KEYS.STATUT), statutFilter)) return false;
        if (domaineFilter && !contientCritere(getVal(rec, KEYS.DOMAINE), domaineFilter)) return false;
        if (typeStructFilter && !normaliserChaine(getVal(rec, KEYS.TYPE_STRUCT)).toLowerCase().includes(typeStructFilter.toLowerCase())) return false;
        if (fonctionFilter && !normaliserChaine(getVal(rec, KEYS.FONCTION)).toLowerCase().includes(fonctionFilter)) return false;

        if (cinemaChecked.length && !cinemaChecked.some(v => contientCritere(getVal(rec, KEYS.DIFF_CINEMA), v))) return false;
        if (directionChecked.length && !directionChecked.some(v => contientCritere(getVal(rec, KEYS.DIFF_DIRECTION), v))) return false;
        if (houdremontChecked.length && !houdremontChecked.some(v => contientCritere(getVal(rec, KEYS.DIFF_HOUDREMONT), v))) return false;
        if (intervenantChecked.length && !intervenantChecked.some(v => contientCritere(getVal(rec, KEYS.DIFF_INTERVENANT), v))) return false;

        return true;
      });

      if (sortColumn) effectuerTriDonnees();
      document.getElementById('result-count').innerText = `${matchingRecords.length} / ${allRecords.length} résultat(s)`;
      selectedIndex = 0;
      afficherTableau();
    }

    function trierTableau(col) {
      if (sortColumn === col) sortAscending = !sortAscending;
      else { sortColumn = col; sortAscending = true; }

      ['NOM', 'PRENOM', 'NOM_Structure', 'Service', 'Ville', 'EMAIL_PRINCIPAL'].forEach(c => {
        const elem = document.getElementById(`sort-${c}`);
        if (elem) {
          elem.innerText = (c === sortColumn) ? (sortAscending ? '▲' : '▼') : '↕';
          elem.style.color = (c === sortColumn) ? '#1677ff' : '#6b7280';
        }
      });
      effectuerTriDonnees();
      afficherTableau();
    }

    function effectuerTriDonnees() {
      const keyMap = {
        'NOM': KEYS.NOM, 'PRENOM': KEYS.PRENOM, 'NOM_Structure': KEYS.STRUCTURE,
        'Service': KEYS.SERVICE, 'Ville': KEYS.VILLE, 'EMAIL_PRINCIPAL': KEYS.EMAIL_PRINCIPAL
      };
      const keys = keyMap[sortColumn] || KEYS.NOM;

      matchingRecords.sort((a, b) => {
        let valA = normaliserChaine(getVal(a, keys)).toLowerCase();
        let valB = normaliserChaine(getVal(b, keys)).toLowerCase();
        if (valA < valB) return sortAscending ? -1 : 1;
        if (valA > valB) return sortAscending ? 1 : -1;
        return 0;
      });
    }

    function reinitialiserFiltres() {
      document.getElementById('filter-text').value = '';
      document.getElementById('filter-service').value = '';
      document.getElementById('filter-statut').value = '';
      document.getElementById('filter-type-structure').value = '';
      document.getElementById('filter-fonction').value = '';
      document.getElementById('filter-domaine').value = '';
      document.querySelectorAll('.search-card input[type="checkbox"]').forEach(cb => cb.checked = false);
      selectedIds.clear();
      sortColumn = null;
      appliquerFiltres();
    }

    function afficherTableau() {
      const tbody = document.getElementById('results-table-body');
      tbody.innerHTML = '';

      const selectAllCb = document.getElementById('select-all');
      if (selectAllCb) selectAllCb.checked = matchingRecords.length > 0 && matchingRecords.every(r => selectedIds.has(r.id));

      matchingRecords.forEach((rec, index) => {
        const tr = document.createElement('tr');
        tr.className = 'result-row';
        const isChecked = selectedIds.has(rec.id);

        if (isChecked) tr.classList.add('checked-row');
        if (index === selectedIndex) tr.classList.add('selected');

        tr.innerHTML = `
          <td>${getVal(rec, KEYS.NOM)}</td>
          <td>${getVal(rec, KEYS.PRENOM)}</td>
          <td>${getVal(rec, KEYS.STRUCTURE)}</td>
          <td>${normaliserChaine(getVal(rec, KEYS.SERVICE))}</td>
          <td>${getVal(rec, KEYS.VILLE)}</td>
          <td>${getVal(rec, KEYS.EMAIL_PRINCIPAL)}</td>
          <td style="text-align: center;"><input type="checkbox" class="row-checkbox" ${isChecked ? 'checked' : ''}></td>
          <td><button class="btn-action-modifier">Modifier</button></td>
        `;

        tr.querySelector('.row-checkbox').onclick = (e) => { e.stopPropagation(); gererClicLigne(index, e, true); };
        tr.querySelector('.btn-action-modifier').onclick = (e) => { e.stopPropagation(); selectedIndex = index; majSelectionGraphique(); ouvrirModal(rec); };
        
        tr.onclick = (e) => gererClicLigne(index, e, false);
        tr.ondblclick = (e) => { e.stopPropagation(); selectedIndex = index; majSelectionGraphique(); ouvrirModal(rec); };

        tbody.appendChild(tr);
      });
      majBoutonsSelection();
    }

    function gererClicLigne(indexIndex, event, isCheckbox) {
      const rec = matchingRecords[indexIndex];
      if (event.shiftKey && lastClickedIndex !== null) {
        const start = Math.min(lastClickedIndex, indexIndex);
        const end = Math.max(lastClickedIndex, indexIndex);
        for (let i = start; i <= end; i++) selectedIds.add(matchingRecords[i].id);
      } else if (isCheckbox) {
        if (selectedIds.has(rec.id)) selectedIds.delete(rec.id);
        else selectedIds.add(rec.id);
        lastClickedIndex = indexIndex;
      }
      selectedIndex = indexIndex;
      majBoutonsSelection();
      majSelectionGraphique();
    }

    function majSelectionGraphique() {
      document.querySelectorAll('#results-table-body tr').forEach((row, idx) => {
        row.classList.toggle('selected', idx === selectedIndex);
      });
    }

    function toutSelectionner(master) {
      matchingRecords.forEach(r => master.checked ? selectedIds.add(r.id) : selectedIds.delete(r.id));
      majBoutonsSelection();
      afficherTableau();
    }

    function majBoutonsSelection() {
      const count = selectedIds.size;
      const btnTxt = document.getElementById('btn-export-selected-txt');
      const btnCsv = document.getElementById('btn-export-selected-csv');
      btnTxt.style.display = count ? 'inline-block' : 'none';
      btnCsv.style.display = count ? 'inline-block' : 'none';
      if (count) {
        btnTxt.innerText = `📩 Exporter mails sélect. TXT (${count})`;
        btnCsv.innerText = `📄 Exporter fiches sélect. (.csv) (${count})`;
      }
    }

    function naviguerTableau(dir) {
      if (!matchingRecords.length) return;
      selectedIndex = Math.max(0, Math.min(matchingRecords.length - 1, selectedIndex + dir));
      majSelectionGraphique();
      const rows = document.querySelectorAll('#results-table-body tr');
      if (rows[selectedIndex]) rows[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function changerZoom(delta) {
      currentFontSize = Math.max(12, Math.min(22, currentFontSize + delta));
      document.querySelector('table').style.fontSize = `${currentFontSize}px`;
    }

    function genererCheckboxesModale(idGroupe, options, valeursActuelles) {
      const listeActuelle = normaliserChaine(valeursActuelles).split(/[,;]/).map(s => s.trim().toLowerCase());
      let html = `<div class="checkbox-group" id="${idGroupe}">`;
      options.forEach(opt => {
        const isChecked = listeActuelle.includes(opt.toLowerCase());
        html += `
          <label class="checkbox-item">
            <input type="checkbox" value="${opt}" ${isChecked ? 'checked' : ''}> ${opt}
          </label>`;
      });
      html += `</div>`;
      return html;
    }

    /* --- GESTION DE LA MODALE ET MODIFICATION DE FICHE --- */

      <datalist id="list-domaines">${(referenceTables.domaines || []).map(s => `<option value="${s}">`).join('')}</datalist>

    function fermerModal(e) {
      if (!e || e.target.id === 'modal-overlay' || e.target.classList.contains('btn-close') || e.target.classList.contains('btn-reset')) {
        document.getElementById('modal-overlay').style.display = 'none';
        currentEditingRecord = null;
      }
    }

    function validerFormatEmail(input) {
      const val = input.value.trim();
      const msgElem = document.getElementById('email-validation-msg');
      if (!val) {
        input.className = '';
        msgElem.innerText = '';
        return true;
      }
      const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
      if (isValid) {
        input.className = 'valid-email';
        msgElem.className = 'email-msg success';
        msgElem.innerText = '✓ Email valide';
      } else {
        input.className = 'invalid-email';
        msgElem.className = 'email-msg error';
        msgElem.innerText = '⚠ Format d\'email invalide';
      }
      return isValid;
    }

    function recupererCochésGroupeModal(idGroupe) {
    const ids = Array.from(document.querySelectorAll(`#${idGroupe} input[type="checkbox"]:checked`))
                     .map(cb => Number(cb.value));
    return ['L', ...ids];
}

    async function sauvegarderContactModifie() {
      if (!currentEditingRecord) return;

      const mailInput = document.getElementById('edit-email');
      if (mailInput.value.trim() && !validerFormatEmail(mailInput)) {
        alert("Veuillez corriger l'adresse email avant de sauvegarder.");
        return;
      }

      const getCheckedList = (id) => recupererCochésGroupeModal(id);

      const fieldsToUpdate = {};
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.NOM)] = document.getElementById('edit-nom').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.PRENOM)] = document.getElementById('edit-prenom').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.STRUCTURE)] = document.getElementById('edit-structure').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.FONCTION)] = document.getElementById('edit-fonction').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.SERVICE)] = document.getElementById('edit-service').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.STATUT)] = document.getElementById('edit-statut').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.TYPE_STRUCT)] = document.getElementById('edit-type-struct').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.DOMAINE)] = document.getElementById('edit-domaine').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.CODE_POSTAL)] = document.getElementById('edit-cp').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.VILLE)] = document.getElementById('edit-ville').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.EMAIL_PRINCIPAL)] = mailInput.value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.EMAILS_SECONDAIRES)] = document.getElementById('edit-emails-sec').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.TEL_PRINCIPAL)] = document.getElementById('edit-tel').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.TELS_SECONDAIRES)] = document.getElementById('edit-tels-sec').value.trim();
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.COMMENTAIRE)] = document.getElementById('edit-commentaire').value.trim();

      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.DIFF_CINEMA)] = getCheckedList('modal-group-cinema');
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.DIFF_DIRECTION)] = getCheckedList('modal-group-direction');
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.DIFF_HOUDREMONT)] = getCheckedList('modal-group-houdremont');
      fieldsToUpdate[findExactExistingKey(currentEditingRecord, KEYS.DIFF_INTERVENANT)] = getCheckedList('modal-group-intervenant');

      try {
        await grist.docApi.applyUserActions([
          ['UpdateRecord', '_integer_table_id' in currentEditingRecord ? currentEditingRecord._integer_table_id : (allRecords.Table || 'CONTACTS'), currentEditingRecord.id, fieldsToUpdate]
        ]);
        fermerModal();
      } catch (err) {
        // Tentative de secours automatique en utilisant le mode générique de Grist
        try {
          const tableId = await grist.selectedTable.getTableId();
          await grist.docApi.applyUserActions([
            ['UpdateRecord', tableId, currentEditingRecord.id, fieldsToUpdate]
          ]);
          fermerModal();
        } catch (e2) {
          alert("Erreur lors de la sauvegarde dans Grist: " + e2.message);
        }
      }
    }

    /* --- FONCTIONS D'EXPORT ET COPIE --- */
    function copierEmails() {
      const recordsToExport = selectedIds.size > 0 
        ? matchingRecords.filter(r => selectedIds.has(r.id))
        : matchingRecords;

      const emails = recordsToExport
        .map(r => getVal(r, KEYS.EMAIL_PRINCIPAL).trim())
        .filter(e => e.length > 0);

      if (!emails.length) {
        alert("Aucun email disponible à copier.");
        return;
      }

      navigator.clipboard.writeText(emails.join('; ')).then(() => {
        alert(`${emails.length} adresse(s) email copiée(s) dans le presse-papier !`);
      }).catch(err => {
        alert("Erreur lors de la copie : " + err);
      });
    }

    function exporterEmailsTXT() {
      téléchargerFichierTXT(matchingRecords, "emails_filtres.txt");
    }

    function exporterMailsSelectionnesTXT() {
      const selected = matchingRecords.filter(r => selectedIds.has(r.id));
      téléchargerFichierTXT(selected, "emails_selectionnes.txt");
    }

    function téléchargerFichierTXT(records, filename) {
      const emails = records
        .map(r => getVal(r, KEYS.EMAIL_PRINCIPAL).trim())
        .filter(e => e.length > 0);

      const blob = new Blob([emails.join('\n')], { type: 'text/plain;charset=utf-8;' });
      telechargerBlob(blob, filename);
    }

    function exporterCSV() {
      genererEtTéléchargerCSV(matchingRecords, "contacts_export.csv");
    }

    function exporterFichesSelectionneesCSV() {
      const selected = matchingRecords.filter(r => selectedIds.has(r.id));
      genererEtTéléchargerCSV(selected, "contacts_selectionnes.csv");
    }

    function genererEtTéléchargerCSV(records, filename) {
      const headers = ["Nom", "Prénom", "Structure", "Service", "Ville", "Code Postal", "Email Principal", "Téléphone", "Fonction"];
      let csvContent = "\uFEFF" + headers.join(";") + "\n";

      records.forEach(r => {
        const row = [
          getVal(r, KEYS.NOM),
          getVal(r, KEYS.PRENOM),
          getVal(r, KEYS.STRUCTURE),
          normaliserChaine(getVal(r, KEYS.SERVICE)),
          getVal(r, KEYS.VILLE),
          getVal(r, KEYS.CODE_POSTAL),
          getVal(r, KEYS.EMAIL_PRINCIPAL),
          getVal(r, KEYS.TEL_PRINCIPAL),
          getVal(r, KEYS.FONCTION)
        ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(";");

        csvContent += row + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      telechargerBlob(blob, filename);
    }

    function telechargerBlob(blob, filename) {
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Gestion des touches du clavier (Échap pour la modale, flèches pour naviguer)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fermerModal();
    });
  </script>
