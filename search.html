<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche de Contact</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; font-size: 14px; display: flex; flex-direction: column; height: 100vh; }
    
    .search-box { margin-bottom: 12px; }
    input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; background: #fff; }
    input[type="text"]:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1); }

    .table-container { flex: 1; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f1f5f9; color: #475569; padding: 10px 12px; position: sticky; top: 0; border-bottom: 1px solid #cbd5e1; font-weight: 600; }
    td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr { cursor: pointer; }
    tr:hover { background-color: #f8fafc; }
    tr.selected { background-color: #eff6ff !important; font-weight: 500; color: #1d4ed8; }
    
    .info-bar { font-size: 12px; color: #64748b; margin-top: 8px; text-align: right; }
  </style>
</head>
<body>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Rechercher par nom, prénom, structure, email..." oninput="filtrerContacts()">
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Structure</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="4" style="text-align: center; color: #94a3b8;">Chargement des données...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="info-bar" id="info-count">0 contact(s)</div>

  <script>
    let allRecords = [];
    let matchingRecords = [];
    let selectedId = null;

    // Connexion à Grist en écriture/sélection
    grist.ready({ requiredAccess: 'full' });

    grist.onRecords(function(records) {
      allRecords = records;
      filtrerContacts();
    });

    // Écoute aussi si Grist change la sélection active par ailleurs
    grist.onSelectedRow(function(recordId) {
      if (recordId && recordId !== selectedId) {
        selectedId = recordId;
        mettreAJourSelectionVisuelle();
      }
    });

    function filtrerContacts() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      
      matchingRecords = allRecords.filter(rec => {
        if (!query) return true;
        // Recherche globale tolérante sur les champs principaux
        const ligneTexte = [
          rec.NOM || '',
          rec.PRENOM || '',
          rec.NOM_Structure || '',
          rec.EMAIL_PRINCIPAL || ''
        ].join(' ').toLowerCase();

        return query.split(/\s+/).every(mot => ligneTexte.includes(mot));
      });

      afficherTableau();
    }

    function afficherTableau() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (matchingRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8;">Aucun résultat trouvé</td></tr>`;
        document.getElementById('info-count').innerText = `0 / ${allRecords.length} contact(s)`;
        return;
      }

      matchingRecords.forEach(rec => {
        const tr = document.createElement('tr');
        if (rec.id === selectedId) tr.classList.add('selected');

        tr.innerHTML = `
          <td>${rec.NOM || ''}</td>
          <td>${rec.PRENOM || ''}</td>
          <td>${rec.NOM_Structure || ''}</td>
          <td>${rec.EMAIL_PRINCIPAL || ''}</td>
        `;

        // Au clic, on sélectionne immédiatement le contact dans Grist
        tr.onclick = () => {
          selectedId = rec.id;
          grist.setSelectedRecord(rec.id);
          mettreAJourSelectionVisuelle();
        };

        tbody.appendChild(tr);
      });

      document.getElementById('info-count').innerText = `${matchingRecords.length} / ${allRecords.length} contact(s)`;
    }

    function mettreAJourSelectionVisuelle() {
      const rows = document.querySelectorAll('#table-body tr');
      rows.forEach((tr, index) => {
        const rec = matchingRecords[index];
        if (rec && rec.id === selectedId) {
          tr.classList.add('selected');
        } else {
          tr.classList.remove('selected');
        }
      });
    }
  </script>
</body>
</html>
