<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche & Navigation Contacts</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; font-size: 15.5px; }
    
    .search-card { background: #ffffff; border-radius: 10px; padding: 20px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 700; color: #1f2937; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .count-badge { background: #e6f4ff; color: #0958d9; font-size: 15.5px; padding: 4px 10px; border-radius: 12px; font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 13.5px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], select { padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16.5px; outline: none; background-color: #fff; width: 100%; }
    input:focus, select:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
    
    .checkbox-group { border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 11px; background-color: #f9fafb; display: flex; flex-direction: column; gap: 6px; height: auto; overflow-y: visible; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: #374151; cursor: pointer; }
    .checkbox-item input[type="checkbox"] { transform: scale(1.1); }

    .actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; align-items: center; }
    .btn-search { background-color: #1677ff; color: white; border: none; padding: 11px 22px; font-size: 16.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-reset { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 11px 19px; font-size: 16.5px; font-weight: 600; border-radius: 6px; cursor: pointer; }

    /* BARRE D'OUTILS DU TABLEAU */
    .table-toolbar { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 11px 14px; border: 1px solid #e5e7eb; border-bottom: none; border-radius: 8px 8px 0 0; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
    .toolbar-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    
    .btn-tool { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 7px 13px; font-size: 15.5px; font-weight: bold; cursor: pointer; color: #374151; }
    .btn-tool:hover { background: #e5e7eb; }
    
    .btn-export { background-color: #10b981; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-export:hover { background-color: #059669; }
    .btn-csv { background-color: #0284c7; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-csv:hover { background-color: #0369a1; }
    .btn-copy { background-color: #8b5cf6; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-copy:hover { background-color: #7c3aed; }

    /* TABLEAU INTEGRE ET REDIMENSIONNABLE */
    .table-container { max-height: 58vh; overflow-y: auto; overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 0 0 8px 8px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    table { width: 100%; border-collapse: collapse; font-size: 15.5px; text-align: left; table-layout: fixed; }
    th { background-color: #f3f4f6; color: #374151; padding: 13px 11px; position: sticky; top: 0; border-bottom: 1px solid #d1d5db; z-index: 5; user-select: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td { padding: 12px 11px; border-bottom: 1px solid #f3f4f6; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr.result-row { cursor: pointer; }
    tr.result-row:hover { background-color: #f0fdf4; }
    tr.selected { background-color: #bae0ff !important; font-weight: 600; }

    .btn-action-modifier { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 4px 8px; font-size: 13.5px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-action-modifier:hover { background-color: #bae6fd; }

    .resizer { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; z-index: 10; }
    .resizer:hover, .resizer.resizing { background-color: #1677ff; }

    /* FENETRE MODALE POUR DOUBLE-CLIC */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; }
    .modal-card { background: #fff; border-radius: 12px; width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #e5e7eb; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; margin-bottom: 16px; }
    .modal-title { font-size: 20px; font-weight: bold; color: #111827; }
    .btn-close { background: #f3f4f6; border: none; font-size: 20px; font-weight: bold; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; color: #6b7280; }
    
    .viewer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .viewer-field { display: flex; flex-direction: column; background: #f9fafb; padding: 11px; border-radius: 6px; border: 1px solid #f3f4f6; }
    .viewer-field.full { grid-column: span 2; }
    .viewer-label { font-size: 12px; font-weight: bold; color: #6b7280; text-transform: uppercase; margin-bottom: 3px; }
    .viewer-value { font-size: 16.5px; color: #111827; word-break: break-word; font-weight: 500; }
  </style>
</head>
<body>

  <!-- RECHERCHE & FILTRES -->
  <div class="search-card">
    <div class="card-title">
      <span>🔍 Recherche Multi-critères</span>
      <span id="result-count" class="count-badge">Chargement...</span>
    </div>

    <div class="grid">
      <div class="field-group">
        <label>Recherche Texte</label>
        <input type="text" id="filter-text" placeholder="Nom, prénom, structure, ville, email..." oninput="appliquerFiltres()">
      </div>

      <div class="field-group">
        <label>Service (Origine)</label>
        <select id="filter-service" onchange="appliquerFiltres()">
          <option value="">-- Tous les services --</option>
          <option value="Arts visuels">Arts visuels</option>
          <option value="Cinéma">Cinéma</option>
          <option value="EAC">EAC</option>
          <option value="Houdremont">Houdremont</option>
          <option value="Patrimoine">Patrimoine</option>
          <option value="Direction">Direction</option>
        </select>
      </div>

      <div class="field-group">
        <label>Statut Juridique</label>
        <select id="filter-statut" onchange="appliquerFiltres()">
          <option value="">-- Tous les statuts --</option>
          <option value="Collectivités territoriales">Collectivités territoriales</option>
          <option value="Association">Association</option>
          <option value="Bailleurs sociaux">Bailleurs sociaux</option>
          <option value="Entreprise">Entreprise</option>
          <option value="Artiste">Artiste</option>
          <option value="Etablissement public">Etablissement public</option>
          <option value="Administration d'Etat">Administration d'Etat</option>
          <option value="Free-lance / indépendant">Free-lance / indépendant</option>
          <option value="Particulier">Particulier</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="field-group">
        <label>Type de structure</label>
        <input type="text" id="filter-type-structure" placeholder="Filtrer type structure..." oninput="appliquerFiltres()">
      </div>

      <div class="field-group">
        <label>Fonction / Profession</label>
        <input type="text" id="filter-fonction" placeholder="Filtrer fonction..." oninput="appliquerFiltres()">
      </div>

      <div class="field-group">
        <label>Domaine d'activités</label>
        <select id="filter-domaine" onchange="appliquerFiltres()">
          <option value="">-- Tous les domaines --</option>
          <option value="Cinéma">Cinéma</option>
          <option value="Patrimoine">Patrimoine</option>
          <option value="Politique culturelle">Politique culturelle</option>
          <option value="Spectacle vivant">Spectacle vivant</option>
          <option value="Arts visuels">Arts visuels</option>
          <option value="Insertion">Insertion</option>
          <option value="Champs social">Champs social</option>
          <option value="Santé / Médico-social">Santé / Médico-social</option>
          <option value="Sport">Sport</option>
          <option value="Petite enfance">Petite enfance</option>
          <option value="Education / Périscolaire">Education / Périscolaire</option>
          <option value="Enseignement supérieur">Enseignement supérieur</option>
          <option value="Enseignement artistique">Enseignement artistique</option>
          <option value="Livre & lecture publique">Livre & lecture publique</option>
          <option value="Environnement">Environnement</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="field-group">
        <label>Diffusion Cinéma</label>
        <div class="checkbox-group" id="group-cinema">
          <label class="checkbox-item"><input type="checkbox" value="Crèche" onchange="appliquerFiltres()"> Crèche</label>
          <label class="checkbox-item"><input type="checkbox" value="Enfance & Jeunesse" onchange="appliquerFiltres()"> Enfance & Jeunesse</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant élémentaire" onchange="appliquerFiltres()"> Enseignant élémentaire</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant maternelle" onchange="appliquerFiltres()"> Enseignant maternelle</label>
        </div>
      </div>

      <div class="field-group">
        <label>Diffusion DCP</label>
        <div class="checkbox-group" id="group-dcp">
          <label class="checkbox-item"><input type="checkbox" value="EAC" onchange="appliquerFiltres()"> EAC</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts visuels" onchange="appliquerFiltres()"> Arts visuels</label>
          <label class="checkbox-item"><input type="checkbox" value="Patrimoine & Archives" onchange="appliquerFiltres()"> Patrimoine & Archives</label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-reset" onclick="reinitialiserFiltres()">Réinitialiser</button>
      <button class="btn-search" onclick="appliquerFiltres()">Rechercher</button>
    </div>
  </div>

  <!-- BARRE D'OUTILS ET NAVIGATION DU TABLEAU -->
  <div class="table-toolbar">
    <div class="toolbar-group">
      <button class="btn-tool" onclick="naviguerTableau(-1)">▲ Précédent</button>
      <button class="btn-tool" onclick="naviguerTableau(1)">▼ Suivant</button>
      <span style="border-left: 1px solid #d1d5db; height: 18px; margin: 0 6px;"></span>
      <button class="btn-tool" onclick="changerZoom(-1)">🔍 -</button>
      <button class="btn-tool" onclick="changerZoom(1)">🔍 +</button>
      <span style="font-size: 14.5px; color: #6b7280; margin-left: 8px;"><i>(Double-clic sur une ligne pour ouvrir la fiche)</i></span>
    </div>

    <div class="toolbar-group">
      <button class="btn-copy" onclick="copierEmails()">📋 Copier les emails (;)</button>
      <button class="btn-export" onclick="exporterEmailsTXT()">📥 Exporter Lots TXT</button>
      <button class="btn-csv" onclick="exporterCSV()">📥 Exporter (.csv)</button>
    </div>
  </div>

  <!-- TABLEAU DE RESULTATS -->
  <div class="table-container">
    <table id="main-table">
      <colgroup>
        <col style="width: 120px;">
        <col style="width: 120px;">
        <col style="width: 180px;">
        <col style="width: 110px;">
        <col style="width: 110px;">
        <col style="width: 180px;">
        <col style="width: 130px;">
      </colgroup>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Structure</th>
          <th>Service</th>
          <th>Ville</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="results-table-body">
        <!-- Généré dynamiquement -->
      </tbody>
    </table>
  </div>

  <!-- FENETRE MODALE POUR DOUBLE-CLIC -->
  <div class="modal-overlay" id="modal-overlay" onclick="fermerModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title" id="m-title">Détail du contact</span>
        <button class="btn-close" onclick="fermerModal()">×</button>
      </div>
      <div class="viewer-grid" id="modal-content">
        <!-- Rempli en JS -->
      </div>
    </div>
  </div>

  <script>
    let allRecords = [];
    let matchingRecords = [];
    let selectedIndex = 0;
    let currentFontSize = 15.5;

    grist.ready({ requiredAccess: 'full' });

    grist.onRecords(function(records) {
      allRecords = records;
      appliquerFiltres();
    });

    function normaliserChaine(valeur) {
      if (!valeur) return "";
      if (typeof valeur === "string") return valeur;
      if (Array.isArray(valeur)) {
        return valeur.map(v => typeof v === 'object' ? JSON.stringify(v) : String(v)).join(", ");
      }
      if (typeof valeur === "object") return JSON.stringify(valeur);
      return String(valeur);
    }

    function contientCritere(champData, valeurRecherchee) {
      const texteChamp = normaliserChaine(champData).toLowerCase();
      return texteChamp.includes(valeurRecherchee.toLowerCase());
    }

    function appliquerFiltres() {
      if (!allRecords || allRecords.length === 0) return;

      const textFilter = document.getElementById('filter-text').value.toLowerCase().trim();
      const serviceFilter = document.getElementById('filter-service').value;
      const statutFilter = document.getElementById('filter-statut').value;
      const typeStructFilter = document.getElementById('filter-type-structure').value.toLowerCase().trim();
      const fonctionFilter = document.getElementById('filter-fonction').value.toLowerCase().trim();
      const domaineFilter = document.getElementById('filter-domaine').value;

      const cinemaChecked = Array.from(document.querySelectorAll('#group-cinema input:checked')).map(cb => cb.value);
      const dcpChecked = Array.from(document.querySelectorAll('#group-dcp input:checked')).map(cb => cb.value);

      matchingRecords = allRecords.filter(rec => {
        if (textFilter) {
          const champsCibles = [
            rec.NOM, rec.PRENOM, rec.NOM_Structure, rec.Ville, rec.Code_Postal,
            rec.EMAIL_PRINCIPAL, rec.EMAILS_SECONDAIRES, rec.Telephone_Principal, 
            rec.Telephones_Secondaires, rec.Fonction_Profession, rec.Commentaire___Description, rec.Commentaire
          ];
          const texteGlobal = champsCibles.map(c => normaliserChaine(c)).join(' ').toLowerCase();
          if (!texteGlobal.includes(textFilter)) return false;
        }

        if (serviceFilter && !contientCritere(rec.Service, serviceFilter)) return false;
        if (statutFilter && !contientCritere(rec.STATUT_JURIDIQUE, statutFilter)) return false;
        if (domaineFilter && !contientCritere(rec.DOMAINE_D_ACTIVITES, domaineFilter)) return false;

        if (typeStructFilter) {
          const valTypeStruct = normaliserChaine(rec.TYPE_DE_STRUCTURE || rec.TYPE_DE_STRUCTURE_CONTACT || rec.Type_de_structure);
          if (!valTypeStruct.toLowerCase().includes(typeStructFilter)) return false;
        }

        if (fonctionFilter) {
          const valFonction = normaliserChaine(rec.Fonction_Profession || rec.Fonction);
          if (!valFonction.toLowerCase().includes(fonctionFilter)) return false;
        }

        if (cinemaChecked.length > 0) {
          const valCinema = rec.Listes_Diffusion_Cinema || rec.Listes_Diffusion_Cin_ma;
          const matchCinema = cinemaChecked.some(val => contientCritere(valCinema, val));
          if (!matchCinema) return false;
        }

        if (dcpChecked.length > 0) {
          const valDcp = rec.Liste_Diffusion_DCP || rec.Liste_Diffusion_Dcp;
          const matchDcp = dcpChecked.some(val => contientCritere(valDcp, val));
          if (!matchDcp) return false;
        }

        return true;
      });

      document.getElementById('result-count').innerText = `${matchingRecords.length} / ${allRecords.length} résultat(s)`;
      selectedIndex = 0;
      afficherTableau();
    }

    function afficherTableau() {
      const tbody = document.getElementById('results-table-body');
      tbody.innerHTML = '';

      matchingRecords.forEach((rec, index) => {
        const tr = document.createElement('tr');
        tr.className = 'result-row';
        if (index === selectedIndex) tr.classList.add('selected');

        tr.innerHTML = `
          <td>${rec.NOM || ''}</td>
          <td>${rec.PRENOM || ''}</td>
          <td>${rec.NOM_Structure || ''}</td>
          <td>${normaliserChaine(rec.Service)}</td>
          <td>${rec.Ville || ''}</td>
          <td>${rec.EMAIL_PRINCIPAL || ''}</td>
          <td><button class="btn-action-modifier">Modifier le contact</button></td>
        `;

        // Action du bouton Modifier : sélectionne le contact et scroll vers le formulaire en bas de page
        const btnModif = tr.querySelector('.btn-action-modifier');
        btnModif.onclick = async (e) => {
          e.stopPropagation();
          await grist.setCursorPos({ rowId: rec.id });
          window.scrollTo({
            top: document.body.scrollHeight,
            behavior: 'smooth'
          });
        };

        tr.onclick = () => {
          selectedIndex = index;
          majSelectionGraphique();
          grist.setCursorPos({ rowId: rec.id });
        };

        tr.ondblclick = () => {
          selectedIndex = index;
          majSelectionGraphique();
          ouvrirModal(rec);
        };

        tbody.appendChild(tr);
      });

      initialiserRedimensionnementColonnes();
    }

    function initialiserRedimensionnementColonnes() {
      const table = document.getElementById('main-table');
      const headers = table.querySelectorAll('th');

      headers.forEach(th => {
        if (th.querySelector('.resizer')) return;

        const resizer = document.createElement('div');
        resizer.classList.add('resizer');
        th.appendChild(resizer);

        let x = 0;
        let w = 0;

        resizer.addEventListener('mousedown', function (e) {
          x = e.clientX;
          w = th.offsetWidth;
          resizer.classList.add('resizing');

          function mouseMoveHandler(e) {
            const dx = e.clientX - x;
            th.style.width = `${Math.max(50, w + dx)}px`;
          }

          function mouseUpHandler() {
            resizer.classList.remove('resizing');
            document.removeEventListener('mousemove', mouseMoveHandler);
            document.removeEventListener('mouseup', mouseUpHandler);
          }

          document.addEventListener('mousemove', mouseMoveHandler);
          document.addEventListener('mouseup', mouseUpHandler);
          e.stopPropagation();
        });
      });
    }

    function majSelectionGraphique() {
      const rows = document.querySelectorAll('#results-table-body tr');
      rows.forEach((row, idx) => {
        row.classList.toggle('selected', idx === selectedIndex);
      });
    }

    function naviguerTableau(dir) {
      const newIndex = selectedIndex + dir;
      if (newIndex >= 0 && newIndex < matchingRecords.length) {
        selectedIndex = newIndex;
        majSelectionGraphique();
        
        const rows = document.querySelectorAll('#results-table-body tr');
        if (rows[selectedIndex]) {
          rows[selectedIndex].scrollIntoView({ block: 'nearest' });
        }

        grist.setCursorPos({ rowId: matchingRecords[selectedIndex].id });
      }
    }

    function changerZoom(delta) {
      currentFontSize = Math.max(11, Math.min(24, currentFontSize + delta));
      document.getElementById('main-table').style.fontSize = `${currentFontSize}px`;
    }

    function ouvrirModal(rec) {
      document.getElementById('m-title').innerText = `${rec.PRENOM || ''} ${rec.NOM || ''}`.trim() || 'Fiche Contact';
      
      const commentaireValeur = rec.Commentaire___Description || rec.Commentaire || rec.DESCRIPTION___COMMENTAIRE || rec.DESCRIPTION_COMMENTAIRE || '-';
      const typeStructValeur = rec.TYPE_DE_STRUCTURE || rec.TYPE_DE_STRUCTURE_CONTACT || rec.Type_de_structure || '-';
      const fonctionValeur = rec.Fonction_Profession || rec.Fonction || '-';

      document.getElementById('modal-content').innerHTML = `
        <div class="viewer-field"><span class="viewer-label">Structure</span><span class="viewer-value">${rec.NOM_Structure || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Service</span><span class="viewer-value">${normaliserChaine(rec.Service) || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Fonction / Profession</span><span class="viewer-value">${fonctionValeur}</span></div>
        <div class="viewer-field"><span class="viewer-label">Statut Juridique</span><span class="viewer-value">${normaliserChaine(rec.STATUT_JURIDIQUE) || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Type de structure</span><span class="viewer-value">${normaliserChaine(typeStructValeur)}</span></div>
        <div class="viewer-field"><span class="viewer-label">Email Principal</span><span class="viewer-value">${rec.EMAIL_PRINCIPAL || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Emails Secondaires</span><span class="viewer-value">${normaliserChaine(rec.EMAILS_SECONDAIRES) || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Téléphone Principal</span><span class="viewer-value">${rec.Telephone_Principal || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Téléphone Secondaire</span><span class="viewer-value">${normaliserChaine(rec.Telephones_Secondaires) || '-'}</span></div>
        <div class="viewer-field full"><span class="viewer-label">Adresse</span><span class="viewer-value">${rec.Adresse || ''} ${rec.Code_Postal || ''} ${rec.Ville || ''}</span></div>
        <div class="viewer-field"><span class="viewer-label">Domaine d'activités</span><span class="viewer-value">${normaliserChaine(rec.DOMAINE_D_ACTIVITES) || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Diffusion Cinéma</span><span class="viewer-value">${normaliserChaine(rec.Listes_Diffusion_Cinema || rec.Listes_Diffusion_Cin_ma) || '-'}</span></div>
        <div class="viewer-field full"><span class="viewer-label">Description / Commentaire</span><span class="viewer-value">${commentaireValeur}</span></div>
      `;

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function fermerModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    function collecterTousLesEmails() {
      let listeEmails = [];
      matchingRecords.forEach(r => {
        if (r.EMAIL_PRINCIPAL && r.EMAIL_PRINCIPAL.trim().length > 0) {
          listeEmails.push(r.EMAIL_PRINCIPAL.trim());
        }
        if (r.EMAILS_SECONDAIRES) {
          const sec = normaliserChaine(r.EMAILS_SECONDAIRES);
          sec.split(/[,;]/).forEach(e => {
            const cleanEmail = e.trim();
            if (cleanEmail.length > 0) listeEmails.push(cleanEmail);
          });
        }
      });
      return listeEmails;
    }

    function copierEmails() {
      const listeEmails = collecterTousLesEmails();
      if (listeEmails.length === 0) {
        alert("Aucune adresse e-mail dans les résultats actuels.");
        return;
      }
      navigator.clipboard.writeText(listeEmails.join('; ')).then(() => {
        alert(`${listeEmails.length} email(s) copié(s) dans le presse-papier !`);
      });
    }

    function exporterEmailsTXT() {
      const listeEmails = collecterTousLesEmails();
      if (listeEmails.length === 0) {
        alert("Aucune adresse e-mail à exporter.");
        return;
      }

      let contenuFichier = "";
      let lotCompteur = 1;
      
      for (let i = 0; i < listeEmails.length; i += 30) {
        const tranche = listeEmails.slice(i, i + 30);
        contenuFichier += `--- Envoi ${lotCompteur} ---\n`;
        contenuFichier += tranche.join('; ') + "\n\n";
        lotCompteur++;
      }

      const blob = new Blob([contenuFichier], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `emails_par_lots_${matchingRecords.length}_contacts.txt`;
      link.click();
    }

    function exporterCSV() {
      if (matchingRecords.length === 0) {
        alert("Aucun résultat à exporter.");
        return;
      }

      const entetes = ["Nom", "Prénom", "Structure", "Service", "Statut Juridique", "Domaine", "Ville", "Email Principal", "Emails Secondaires", "Téléphone Principal", "Téléphone Secondaire"];
      let csvContent = "\uFEFF" + entetes.join(";") + "\n";

      matchingRecords.forEach(r => {
        const ligne = [
          `"${(r.NOM || '').replace(/"/g, '""')}"`,
          `"${(r.PRENOM || '').replace(/"/g, '""')}"`,
          `"${(r.NOM_Structure || '').replace(/"/g, '""')}"`,
          `"${normaliserChaine(r.Service).replace(/"/g, '""')}"`,
          `"${normaliserChaine(r.STATUT_JURIDIQUE).replace(/"/g, '""')}"`,
          `"${normaliserChaine(r.DOMAINE_D_ACTIVITES).replace(/"/g, '""')}"`,
          `"${(r.Ville || '').replace(/"/g, '""')}"`,
          `"${(r.EMAIL_PRINCIPAL || '').replace(/"/g, '""')}"`,
          `"${normaliserChaine(r.EMAILS_SECONDAIRES).replace(/"/g, '""')}"`,
          `"${(r.Telephone_Principal || '').replace(/"/g, '""')}"`,
          `"${normaliserChaine(r.Telephones_Secondaires).replace(/"/g, '""')}"`
        ];
        csvContent += ligne.join(";") + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `export_contacts_${matchingRecords.length}.csv`;
      link.click();
    }

    function reinitialiserFiltres() {
      document.getElementById('filter-text').value = '';
      document.getElementById('filter-service').value = '';
      document.getElementById('filter-statut').value = '';
      document.getElementById('filter-type-structure').value = '';
      document.getElementById('filter-fonction').value = '';
      document.getElementById('filter-domaine').value = '';

      document.querySelectorAll('.checkbox-group input[type="checkbox"]').forEach(cb => cb.checked = false);

      appliquerFiltres();
    }
  </script>
</body>
</html>
