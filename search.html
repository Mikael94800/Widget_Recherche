<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Création Contact Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; font-size: 15.5px; }
    
    .form-card { background: #ffffff; border-radius: 10px; padding: 20px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 700; color: #1f2937; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .title-left { display: flex; align-items: center; gap: 10px; }
    .title-actions { display: flex; gap: 8px; align-items: center; }

    .status-badge { background: #e6f4ff; color: #0958d9; font-size: 14px; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
    .btn-export { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 6px 12px; font-size: 13.5px; font-weight: 600; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-export:hover { background-color: #e2e8f0; color: #1e293b; border-color: #94a3b8; }

    .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    .checkboxes-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }

    .field-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 13.5px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], select, textarea { padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15.5px; outline: none; background-color: #fff; width: 100%; transition: all 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
    
    input.invalid-email { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    input.valid-email { border-color: #10b981 !important; background-color: #f0fdf4 !important; }
    .email-msg { font-size: 11.5px; margin-top: 2px; font-weight: 600; }
    .email-msg.error { color: #dc2626; }
    .email-msg.success { color: #16a34a; }

    .checkbox-group { border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 11px; background-color: #f9fafb; display: flex; flex-direction: column; gap: 6px; max-height: 120px; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: #374151; cursor: pointer; text-transform: none; font-weight: normal; }
    .checkbox-item input[type="checkbox"] { transform: scale(1.1); cursor: pointer; }

    .actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; align-items: center; }
    .btn-save { background-color: #10b981; color: white; border: none; padding: 11px 22px; font-size: 16.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-save:hover { background-color: #059669; }
    .btn-reset { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 11px 19px; font-size: 16.5px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .btn-reset:hover { background-color: #e5e7eb; }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="card-title">
      <div class="title-left">
        <span>➕ Création d'un Nouveau Contact</span>
        <span id="form-status" class="status-badge">Prêt</span>
      </div>
      <div class="title-actions">
        <button class="btn-export" onclick="exporterCSV('recherche')" title="Télécharger les lignes issues de la recherche/vue active en CSV">📥 CSV Recherche</button>
        <button class="btn-export" onclick="exporterCSV('selection')" title="Télécharger uniquement la ou les lignes sélectionnées en CSV">📥 CSV Sélection</button>
      </div>
    </div>

    <!-- Ligne 1 : Service, Nom & Prénom -->
    <div class="form-row">
      <div class="field-group">
        <label>Service (Origine)</label>
        <select id="create-service"><option value="">-- Sélectionner --</option></select>
      </div>
      <div class="field-group">
        <label>Nom *</label>
        <input type="text" id="create-nom" placeholder="Nom de famille...">
      </div>
      <div class="field-group">
        <label>Prénom</label>
        <input type="text" id="create-prenom" placeholder="Prénom...">
      </div>
    </div>

    <!-- Ligne 2 : Structure, Statut & Type de structure -->
    <div class="form-row">
      <div class="field-group">
        <label>Structure</label>
        <input type="text" id="create-structure" placeholder="Nom de la structure...">
      </div>
      <div class="field-group">
        <label>Statut Juridique</label>
        <select id="create-statut"><option value="">-- Sélectionner --</option></select>
      </div>
      <div class="field-group">
        <label>Type de structure</label>
        <select id="create-type-structure"><option value="">-- Sélectionner --</option></select>
      </div>
    </div>

    <!-- Ligne 3 : Fonction, Domaine, Ville / CP -->
    <div class="form-row">
      <div class="field-group">
        <label>Fonction / Profession</label>
        <input type="text" id="create-fonction" placeholder="Fonction...">
      </div>
      <div class="field-group">
        <label>Domaine d'activités</label>
        <select id="create-domaine"><option value="">-- Sélectionner --</option></select>
      </div>
      <div class="field-group">
        <label>Ville</label>
        <input type="text" id="create-ville" placeholder="Ville...">
      </div>
    </div>

    <!-- Ligne 4 : Contacts Principaux -->
    <div class="form-row">
      <div class="field-group">
        <label>Email Principal</label>
        <input type="text" id="create-email" placeholder="email@exemple.fr" oninput="verifierEmailInput(this, 'email-msg')">
        <div id="email-msg" class="email-msg"></div>
      </div>
      <div class="field-group">
        <label>Téléphone Principal</label>
        <input type="text" id="create-tel" placeholder="06 00 00 00 00...">
      </div>
      <div class="field-group">
        <label>Code Postal</label>
        <input type="text" id="create-cp" placeholder="Code postal...">
      </div>
    </div>

    <!-- Ligne 5 : Contacts Secondaires -->
    <div class="form-row">
      <div class="field-group">
        <label>Email Secondaire</label>
        <input type="text" id="create-email-sec" placeholder="email.sec@exemple.fr" oninput="verifierEmailInput(this, 'email-sec-msg')">
        <div id="email-sec-msg" class="email-msg"></div>
      </div>
      <div class="field-group">
        <label>Téléphone Secondaire</label>
        <input type="text" id="create-tel-sec" placeholder="Téléphone secondaire...">
      </div>
      <div class="field-group"></div>
    </div>

    <!-- Listes de diffusion (Checkboxes dynamiques) -->
    <div style="margin-top: 14px; margin-bottom: 6px;"><label>Listes de Diffusion</label></div>
    <div class="checkboxes-container">
      <div class="field-group">
        <label style="font-size: 12px; color: #6b7280;">Diffusion Cinéma</label>
        <div class="checkbox-group" id="group-cinema"></div>
      </div>
      <div class="field-group">
        <label style="font-size: 12px; color: #6b7280;">Diffusion Direction</label>
        <div class="checkbox-group" id="group-direction"></div>
      </div>
      <div class="field-group">
        <label style="font-size: 12px; color: #6b7280;">Diffusion Houdremont</label>
        <div class="checkbox-group" id="group-houdremont"></div>
      </div>
      <div class="field-group">
        <label style="font-size: 12px; color: #6b7280;">Diffusion Intervenant</label>
        <div class="checkbox-group" id="group-intervenant"></div>
      </div>
    </div>

    <!-- Commentaire -->
    <div class="field-group" style="margin-top: 12px;">
      <label>Commentaire / Description</label>
      <textarea id="create-commentaire" rows="2" placeholder="Notes complémentaires..."></textarea>
    </div>

    <div class="actions">
      <button class="btn-reset" onclick="reinitialiserFormulaire()">Effacer</button>
      <button class="btn-save" onclick="creerContact()">Enregistrer le contact</button>
    </div>
  </div>

  <script>
    let allRecords = [];
    let selectedRecords = [];
    let referenceTables = { services: [], statuts: [], etiquettes: null };

    const KEYS = {
      NOM: ['NOM', 'Nom'],
      PRENOM: ['PRENOM', 'Prénom', 'Prenom'],
      STRUCTURE: ['NOM_Structure', 'NOM Structure', 'Structure', 'Structure_Contact', 'Nom_Structure'],
      FONCTION: ['Fonction_Profession', 'Fonction / Profession', 'Fonction'],
      SERVICE: ['Service', 'Service_Origine', 'Service (Origine)'],
      STATUT: ['STATUT_JURIDIQUE', 'Statut Juridique', 'Statut_Juridique'],
      TYPE_STRUCT: ['TYPE_DE_STRUCTURE_CONTACT', 'TYPE_DE_STRUCTURE', 'Type de structure'],
      DOMAINE: ['DOMAINE_D_ACTIVITES', "Domaine d'activités", 'Domaine_d_activites'],
      CODE_POSTAL: ['Code_Postal', 'Code Postal', 'CP'],
      VILLE: ['Ville', 'VILLE'],
      EMAIL_PRINCIPAL: ['EMAIL_PRINCIPAL', 'Email Principal', 'Email'],
      EMAIL_SECONDAIRE: ['Email_Secondaire', 'Email Secondaire', 'EMAIL_SECONDAIRE'],
      TEL_PRINCIPAL: ['Telephone_Principal', 'Téléphone Principal', 'Tel_Principal'],
      TEL_SECONDAIRE: ['Telephone_Secondaire', 'Téléphone Secondaire', 'Tel_Secondaire'],
      DIFF_CINEMA: ['Listes_Diffusion_Cinema', 'Listes Diffusion Cinéma', 'Diffusion Cinéma', 'Diffusion_Cinema'],
      DIFF_DIRECTION: ['Listes_Diffusion_Direction', 'Listes Diffusion Direction', 'Diffusion Direction', 'Diffusion_Direction'],
      DIFF_HOUDREMONT: ['Listes_Diffusion_Houdremont', 'Listes Diffusion Houdremont', 'Diffusion Houdremont', 'Diffusion_Houdremont'],
      DIFF_INTERVENANT: ['Listes_Diffusion_Intervenants', 'Listes_Diffusion_Intervenant', 'Listes Diffusion Intervenant', 'Diffusion Intervenant', 'Diffusion_Intervenant'],
      COMMENTAIRE: ['Commentaire_Description', 'Commentaire / Description', 'Commentaire']
    };

    grist.ready({ requiredAccess: 'full' });

    grist.onRecords(async function(records) {
      allRecords = records;
      await chargerTablesDeReference();
      remplirListesDeroulantes();
      peuplerCheckboxesDiffusion();
    });

    grist.onSelectedRows(function(rows) {
      selectedRecords = rows || [];
    });

    async function chargerTablesDeReference() {
      try {
        const fetchTable = async (name) => {
          try { return await grist.docApi.fetchTable(name); } catch(e) { return null; }
        };
        
        const tServ = await fetchTable('SERVICES') || await fetchTable('Services');
        if(tServ) referenceTables.services = tServ.Nom || tServ.Service || [];
        
        const tStat = await fetchTable('STATUTS') || await fetchTable('Statuts');
        if(tStat) referenceTables.statuts = tStat.Nom || tStat.Statut || [];

        const tEtiquettes = await fetchTable('ETIQUETTES') || await fetchTable('Etiquettes');
        if(tEtiquettes) referenceTables.etiquettes = tEtiquettes;

      } catch(e) { console.warn("Tables de référence non chargées :", e); }
    }

    function normaliserChaine(valeur) {
      if (!valeur) return "";
      if (typeof valeur === "string") return valeur;
      if (Array.isArray(valeur)) {
        return valeur.map(v => (typeof v === 'object' && v !== null && v.L) ? v.L : String(v)).join(", ");
      }
      if (typeof valeur === "object") return valeur.L || JSON.stringify(valeur);
      return String(valeur);
    }

    function extraireValeursUniques(cles) {
      const valeursSet = new Set();
      allRecords.forEach(r => {
        const val = r[cles.find(k => r[k] !== undefined)];
        if (val) {
          normaliserChaine(val).split(/[,;]/).forEach(v => {
            const clean = v.trim();
            if (clean) valeursSet.add(clean);
          });
        }
      });
      return Array.from(valeursSet).sort();
    }

    function remplirListesDeroulantes() {
      const alimenter = (elementId, options) => {
        const sel = document.getElementById(elementId);
        sel.innerHTML = '<option value="">-- Sélectionner --</option>' + options.map(o => `<option value="${o}">${o}</option>`).join('');
      };

      const servicesList = Array.from(new Set([...referenceTables.services, ...extraireValeursUniques(KEYS.SERVICE)]));
      const statutsList = Array.from(new Set([...referenceTables.statuts, ...extraireValeursUniques(KEYS.STATUT)]));
      const typesList = extraireValeursUniques(KEYS.TYPE_STRUCT);
      const domainesList = extraireValeursUniques(KEYS.DOMAINE);

      alimenter('create-service', servicesList);
      alimenter('create-statut', statutsList);
      alimenter('create-type-structure', typesList);
      alimenter('create-domaine', domainesList);
    }

    function peuplerCheckboxesDiffusion() {
      if (!referenceTables.etiquettes) return;

      const genererGroupe = (clesPossibles, containerId) => {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';

        const colName = clesPossibles.find(k => referenceTables.etiquettes[k] !== undefined);
        if (!colName) return;

        const valeurs = referenceTables.etiquettes[colName];
        if (Array.isArray(valeurs)) {
          valeurs.forEach(val => {
            if (val !== null && val !== undefined && String(val).trim() !== '') {
              const label = document.createElement('label');
              label.className = 'checkbox-item';
              label.innerHTML = `<input type="checkbox" value="${val}"> ${val}`;
              container.appendChild(label);
            }
          });
        }
      };

      genererGroupe(KEYS.DIFF_CINEMA, 'group-cinema');
      genererGroupe(KEYS.DIFF_DIRECTION, 'group-direction');
      genererGroupe(KEYS.DIFF_HOUDREMONT, 'group-houdremont');
      genererGroupe(KEYS.DIFF_INTERVENANT, 'group-intervenant');
    }

    function verifierEmailInput(input, msgId) {
      const val = input.value.trim();
      const msg = document.getElementById(msgId);
      if (!val) {
        input.className = '';
        msg.textContent = '';
        return;
      }
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (regex.test(val)) {
        input.className = 'valid-email';
        msg.className = 'email-msg success';
        msg.textContent = 'Format email valide';
      } else {
        input.className = 'invalid-email';
        msg.className = 'email-msg error';
        msg.textContent = 'Format email invalide';
      }
    }

    function exporterCSV(type) {
      let dataToExport = [];
      let filename = "";

      if (type === 'recherche') {
        dataToExport = allRecords;
        filename = "contacts_recherche.csv";
      } else if (type === 'selection') {
        dataToExport = selectedRecords;
        filename = "contacts_selection.csv";
      }

      if (!dataToExport || dataToExport.length === 0) {
        alert(type === 'selection' 
          ? "Aucune ligne sélectionnée. Veuillez sélectionner au moins une ligne dans le tableau." 
          : "Aucune donnée disponible pour la recherche en cours.");
        return;
      }

      // Collecter toutes les clés uniques présentes dans les enregistrements (en ignorant 'id')
      const colonnesSet = new Set();
      dataToExport.forEach(r => {
        Object.keys(r).forEach(k => {
          if (k !== 'id') colonnesSet.add(k);
        });
      });
      const colonnes = Array.from(colonnesSet);

      let csvContent = "\uFEFF"; // BOM pour forcer Excel à lire les accents en UTF-8
      csvContent += colonnes.join(";") + "\r\n";

      dataToExport.forEach(r => {
        const ligne = colonnes.map(col => {
          let val = r[col];
          if (val === null || val === undefined) val = "";
          val = normaliserChaine(val);
          // Échapper les guillemets et entourer de guillemets s'il y a des points-virgules ou sauts de ligne
          val = val.replace(/"/g, '""');
          if (val.includes(";") || val.includes("\n") || val.includes('"')) {
            val = `"${val}"`;
          }
          return val;
        });
        csvContent += ligne.join(";") + "\r\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function creerContact() {
      const nom = document.getElementById('create-nom').value.trim();
      const prenom = document.getElementById('create-prenom').value.trim();

      if (!nom && !prenom) {
        alert("Veuillez renseigner au moins un Nom ou un Prénom.");
        document.getElementById('create-nom').focus();
        return;
      }

      const nouveauContact = {};

      const setFieldIfExists = (keys, value) => {
        if (!value) return;
        let targetKey = keys[0];
        if (allRecords.length > 0) {
          const found = keys.find(k => k in allRecords[0]);
          if (found) targetKey = found;
        }
        nouveauContact[targetKey] = value;
      };

      setFieldIfExists(KEYS.NOM, nom);
      setFieldIfExists(KEYS.PRENOM, prenom);
      setFieldIfExists(KEYS.SERVICE, document.getElementById('create-service').value);
      setFieldIfExists(KEYS.STRUCTURE, document.getElementById('create-structure').value.trim());
      setFieldIfExists(KEYS.STATUT, document.getElementById('create-statut').value);
      setFieldIfExists(KEYS.TYPE_STRUCT, document.getElementById('create-type-structure').value);
      setFieldIfExists(KEYS.FONCTION, document.getElementById('create-fonction').value.trim());
      setFieldIfExists(KEYS.DOMAINE, document.getElementById('create-domaine').value);
      setFieldIfExists(KEYS.VILLE, document.getElementById('create-ville').value.trim());
      setFieldIfExists(KEYS.CODE_POSTAL, document.getElementById('create-cp').value.trim());
      setFieldIfExists(KEYS.EMAIL_PRINCIPAL, document.getElementById('create-email').value.trim());
      setFieldIfExists(KEYS.EMAIL_SECONDAIRE, document.getElementById('create-email-sec').value.trim());
      setFieldIfExists(KEYS.TEL_PRINCIPAL, document.getElementById('create-tel').value.trim());
      setFieldIfExists(KEYS.TEL_SECONDAIRE, document.getElementById('create-tel-sec').value.trim());
      setFieldIfExists(KEYS.COMMENTAIRE, document.getElementById('create-commentaire').value.trim());

      const getCheckedValues = (selector) => {
        return Array.from(document.querySelectorAll(`${selector} input:checked`)).map(cb => cb.value).join(', ');
      };

      setFieldIfExists(KEYS.DIFF_CINEMA, getCheckedValues('#group-cinema'));
      setFieldIfExists(KEYS.DIFF_DIRECTION, getCheckedValues('#group-direction'));
      setFieldIfExists(KEYS.DIFF_HOUDREMONT, getCheckedValues('#group-houdremont'));
      setFieldIfExists(KEYS.DIFF_INTERVENANT, getCheckedValues('#group-intervenant'));

      try {
        document.getElementById('form-status').innerText = "Enregistrement...";
        
        await grist.docApi.applyUserActions([
          ['AddRecord', 'CONTACTS', null, nouveauContact]
        ]);

        document.getElementById('form-status').innerText = "Enregistré avec succès !";
        setTimeout(() => { document.getElementById('form-status').innerText = "Prêt"; }, 3000);

        reinitialiserFormulaire();
      } catch (error) {
        console.error("Erreur d'enregistrement :", error);
        alert("Erreur lors de la création du contact : " + (error.message || error));
        document.getElementById('form-status').innerText = "Erreur";
      }
    }

    function reinitialiserFormulaire() {
      document.querySelectorAll('input[type="text"]').forEach(i => { i.value = ''; i.className = ''; });
      document.querySelectorAll('select').forEach(s => s.value = '');
      document.querySelectorAll('textarea').forEach(t => t.value = '');
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
      document.querySelectorAll('.email-msg').forEach(m => m.textContent = '');
      document.getElementById('create-service').focus();
    }
  </script>
</body>
</html>
