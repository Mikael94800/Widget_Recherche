<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche & Visionneuse Contacts</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; }
    
    .search-card { background: #ffffff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; margin-bottom: 16px; }
    .card-title { font-size: 15px; font-weight: 700; color: #1f2937; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .count-badge { background: #e6f4ff; color: #0958d9; font-size: 12px; padding: 3px 8px; border-radius: 12px; font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .field-group { display: flex; flex-direction: column; gap: 3px; }
    label { font-size: 10px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], select { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; background-color: #fff; width: 100%; }
    input:focus, select:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
    
    .checkbox-group { border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 8px; background-color: #f9fafb; display: flex; flex-direction: column; gap: 4px; max-height: 85px; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #374151; cursor: pointer; }
    .checkbox-item input { width: auto; cursor: pointer; }

    .actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; align-items: center; }
    .btn-search { background-color: #1677ff; color: white; border: none; padding: 8px 16px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-search:hover { background-color: #0958d9; }
    .btn-reset { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .btn-reset:hover { background-color: #e5e7eb; }

    /* LAYOUT DEUX COLONNES : TABLEAU & FICHE */
    .results-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .results-container { grid-template-columns: 1fr; } }

    /* TABLEAU INTEGRE */
    .table-container { max-height: 480px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th { background-color: #f3f4f6; color: #374151; padding: 8px; position: sticky; top: 0; border-bottom: 1px solid #d1d5db; z-index: 10; }
    td { padding: 8px; border-bottom: 1px solid #f3f4f6; color: #1f2937; }
    tr.result-row { cursor: pointer; transition: background 0.15s; }
    tr.result-row:hover { background-color: #e6f4ff; }
    tr.selected { background-color: #bae0ff !important; font-weight: bold; }

    /* VISIONNEUSE FICHE CONTACT */
    .viewer-card { background: #ffffff; border-radius: 10px; padding: 16px; border: 1px solid #e5e7eb; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
    .viewer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f3f4f6; padding-bottom: 10px; margin-bottom: 12px; }
    .viewer-title { font-size: 16px; font-weight: bold; color: #111827; }
    .nav-controls { display: flex; gap: 8px; align-items: center; }
    .btn-nav { background-color: #f3f4f6; border: 1px solid #d1d5db; padding: 4px 10px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; color: #374151; }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-nav:hover:not(:disabled) { background-color: #e5e7eb; }

    .viewer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
    .viewer-field { display: flex; flex-direction: column; background: #f9fafb; padding: 8px; border-radius: 6px; border: 1px solid #f3f4f6; }
    .viewer-field.full { grid-column: span 2; }
    .viewer-label { font-size: 10px; font-weight: bold; color: #6b7280; text-transform: uppercase; margin-bottom: 2px; }
    .viewer-value { font-size: 13px; color: #111827; word-break: break-word; font-weight: 500; }
    .no-result { text-align: center; color: #9ca3af; padding: 40px 0; font-style: italic; }
  </style>
</head>
<body>

  <!-- FICHE DE RECHERCHE ET FILTRES -->
  <div class="search-card">
    <div class="card-title">
      <span>🔍 Recherche & Filtres Multi-critères</span>
      <span id="result-count" class="count-badge">Chargement...</span>
    </div>

    <div class="grid">
      <div class="field-group">
        <label>Recherche Texte</label>
        <input type="text" id="filter-text" placeholder="Nom, prénom, structure, ville, email..." oninput="appliquerFiltres()">
      </div>

      <div class="field-group">
        <label>Service (Origine)</label>
        <select id="filter-service" onchange="appliquerFiltres()">
          <option value="">-- Tous les services --</option>
          <option value="Arts visuels">Arts visuels</option>
          <option value="Cinéma">Cinéma</option>
          <option value="EAC">EAC</option>
          <option value="Houdremont">Houdremont</option>
          <option value="Patrimoine">Patrimoine</option>
          <option value="Direction">Direction</option>
        </select>
      </div>

      <div class="field-group">
        <label>Statut Juridique</label>
        <select id="filter-statut" onchange="appliquerFiltres()">
          <option value="">-- Tous les statuts --</option>
          <option value="Collectivités territoriales">Collectivités territoriales</option>
          <option value="Association">Association</option>
          <option value="Bailleurs sociaux">Bailleurs sociaux</option>
          <option value="Entreprise">Entreprise</option>
          <option value="Artiste">Artiste</option>
          <option value="Etablissement public">Etablissement public</option>
          <option value="Administration d'Etat">Administration d'Etat</option>
          <option value="Free-lance / indépendant">Free-lance / indépendant</option>
          <option value="Particulier">Particulier</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="field-group">
        <label>Domaine d'activités</label>
        <select id="filter-domaine" onchange="appliquerFiltres()">
          <option value="">-- Tous les domaines --</option>
          <option value="Cinéma">Cinéma</option>
          <option value="Patrimoine">Patrimoine</option>
          <option value="Politique culturelle">Politique culturelle</option>
          <option value="Spectacle vivant">Spectacle vivant</option>
          <option value="Arts visuels">Arts visuels</option>
          <option value="Insertion">Insertion</option>
          <option value="Champs social">Champs social</option>
          <option value="Santé / Médico-social">Santé / Médico-social</option>
          <option value="Sport">Sport</option>
          <option value="Petite enfance">Petite enfance</option>
          <option value="Education / Périscolaire">Education / Périscolaire</option>
          <option value="Enseignement supérieur">Enseignement supérieur</option>
          <option value="Enseignement artistique">Enseignement artistique</option>
          <option value="Livre & lecture publique">Livre & lecture publique</option>
          <option value="Environnement">Environnement</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="field-group">
        <label>Diffusion Cinéma</label>
        <div class="checkbox-group" id="group-cinema">
          <label class="checkbox-item"><input type="checkbox" value="Crèche" onchange="appliquerFiltres()"> Crèche</label>
          <label class="checkbox-item"><input type="checkbox" value="Enfance & Jeunesse" onchange="appliquerFiltres()"> Enfance & Jeunesse</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant élémentaire" onchange="appliquerFiltres()"> Enseignant élémentaire</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant maternelle" onchange="appliquerFiltres()"> Enseignant maternelle</label>
        </div>
      </div>

      <div class="field-group">
        <label>Diffusion DCP</label>
        <div class="checkbox-group" id="group-dcp">
          <label class="checkbox-item"><input type="checkbox" value="EAC" onchange="appliquerFiltres()"> EAC</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts visuels" onchange="appliquerFiltres()"> Arts visuels</label>
          <label class="checkbox-item"><input type="checkbox" value="Patrimoine & Archives" onchange="appliquerFiltres()"> Patrimoine & Archives</label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-reset" onclick="reinitialiserFiltres()">Réinitialiser</button>
      <button class="btn-search" onclick="appliquerFiltres()">Rechercher</button>
    </div>
  </div>

  <!-- SECTION RESULTATS : TABLEAU + FICHE VISIONNEUSE -->
  <div class="results-container">
    
    <!-- TABLEAU DE RESULTATS -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Structure</th>
            <th>Service</th>
          </tr>
        </thead>
        <tbody id="results-table-body">
          <!-- Rempli en JS -->
        </tbody>
      </table>
    </div>

    <!-- VISIONNEUSE DE FICHE CONTACT -->
    <div class="viewer-card">
      <div>
        <div class="viewer-header">
          <span class="viewer-title" id="v-title">Fiche Contact</span>
          <div class="nav-controls">
            <button class="btn-nav" id="btn-prev" onclick="naviguer(-1)">◄ Précédent</button>
            <span id="nav-indicator" style="font-size: 11px; font-weight: 600; color: #6b7280;">0 / 0</span>
            <button class="btn-nav" id="btn-next" onclick="naviguer(1)">Suivant ►</button>
          </div>
        </div>

        <div id="viewer-content" class="viewer-grid">
          <!-- Les champs du contact s'affichent ici -->
        </div>
      </div>
    </div>

  </div>

  <script>
    let allRecords = [];
    let matchingRecords = [];
    let currentIndex = 0;

    grist.ready({ requiredAccess: 'full' });

    grist.onRecords(function(records) {
      allRecords = records;
      appliquerFiltres();
    });

    function normaliserChaine(valeur) {
      if (!valeur) return "";
      if (typeof valeur === "string") return valeur;
      if (Array.isArray(valeur)) {
        return valeur.map(v => typeof v === 'object' ? JSON.stringify(v) : String(v)).join(" ");
      }
      if (typeof valeur === "object") return JSON.stringify(valeur);
      return String(valeur);
    }

    function contientCritere(champData, valeurRecherchee) {
      const texteChamp = normaliserChaine(champData).toLowerCase();
      return texteChamp.includes(valeurRecherchee.toLowerCase());
    }

    function appliquerFiltres() {
      if (!allRecords || allRecords.length === 0) return;

      const textFilter = document.getElementById('filter-text').value.toLowerCase().trim();
      const serviceFilter = document.getElementById('filter-service').value;
      const statutFilter = document.getElementById('filter-statut').value;
      const domaineFilter = document.getElementById('filter-domaine').value;

      const cinemaChecked = Array.from(document.querySelectorAll('#group-cinema input:checked')).map(cb => cb.value);
      const dcpChecked = Array.from(document.querySelectorAll('#group-dcp input:checked')).map(cb => cb.value);

      matchingRecords = allRecords.filter(rec => {
        if (textFilter) {
          const champsCibles = [
            rec.NOM, rec.PRENOM, rec.NOM_Structure, rec.Ville, rec.Code_Postal,
            rec.EMAIL_PRINCIPAL, rec.EMAILS_SECONDAIRES, rec.Telephone_Principal, 
            rec.Telephones_Secondaires, rec.Fonction_Profession, rec.Commentaire___Description, rec.Commentaire
          ];
          const texteGlobal = champsCibles.map(c => normaliserChaine(c)).join(' ').toLowerCase();
          if (!texteGlobal.includes(textFilter)) return false;
        }

        if (serviceFilter && !contientCritere(rec.Service, serviceFilter)) return false;
        if (statutFilter && !contientCritere(rec.STATUT_JURIDIQUE, statutFilter)) return false;
        if (domaineFilter && !contientCritere(rec.DOMAINE_D_ACTIVITES, domaineFilter)) return false;

        if (cinemaChecked.length > 0) {
          const valCinema = rec.Listes_Diffusion_Cinema || rec.Listes_Diffusion_Cin_ma;
          const matchCinema = cinemaChecked.some(val => contientCritere(valCinema, val));
          if (!matchCinema) return false;
        }

        if (dcpChecked.length > 0) {
          const valDcp = rec.Liste_Diffusion_DCP || rec.Liste_Diffusion_Dcp;
          const matchDcp = dcpChecked.some(val => contientCritere(valDcp, val));
          if (!matchDcp) return false;
        }

        return true;
      });

      const badge = document.getElementById('result-count');
      badge.innerText = `${matchingRecords.length} / ${allRecords.length} résultat(s)`;

      currentIndex = 0;
      afficherTableau();
      afficherFicheCourante();
    }

    function afficherTableau() {
      const tbody = document.getElementById('results-table-body');
      tbody.innerHTML = '';

      matchingRecords.forEach((rec, index) => {
        const tr = document.createElement('tr');
        tr.className = 'result-row';
        if (index === currentIndex) tr.classList.add('selected');

        tr.innerHTML = `
          <td>${rec.NOM || ''}</td>
          <td>${rec.PRENOM || ''}</td>
          <td>${rec.NOM_Structure || ''}</td>
          <td>${normaliserChaine(rec.Service)}</td>
        `;

        tr.onclick = () => {
          currentIndex = index;
          afficherTableau();
          afficherFicheCourante();
        };
        tbody.appendChild(tr);
      });
    }

    function afficherFicheCourante() {
      const container = document.getElementById('viewer-content');
      const navIndicator = document.getElementById('nav-indicator');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      if (matchingRecords.length === 0) {
        container.innerHTML = '<div class="no-result full">Aucun contact ne correspond à la recherche.</div>';
        navIndicator.innerText = '0 / 0';
        btnPrev.disabled = true;
        btnNext.disabled = true;
        return;
      }

      const rec = matchingRecords[currentIndex];

      // Mise à jour de la navigation
      navIndicator.innerText = `${currentIndex + 1} / ${matchingRecords.length}`;
      btnPrev.disabled = (currentIndex === 0);
      btnNext.disabled = (currentIndex === matchingRecords.length - 1);

      // Notification à Grist (positionne aussi le curseur global si besoin)
      grist.setCursorPos({ rowId: rec.id });

      // Remplissage de la Fiche
      document.getElementById('v-title').innerText = `${rec.PRENOM || ''} ${rec.NOM || ''}`.trim() || 'Fiche Contact';

      container.innerHTML = `
        <div class="viewer-field"><span class="viewer-label">Structure</span><span class="viewer-value">${rec.NOM_Structure || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Service</span><span class="viewer-value">${normaliserChaine(rec.Service) || '-'}</span></div>
        
        <div class="viewer-field"><span class="viewer-label">Fonction</span><span class="viewer-value">${rec.Fonction_Profession || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Statut Juridique</span><span class="viewer-value">${normaliserChaine(rec.STATUT_JURIDIQUE) || '-'}</span></div>

        <div class="viewer-field"><span class="viewer-label">Email Principal</span><span class="viewer-value">${rec.EMAIL_PRINCIPAL || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Téléphone</span><span class="viewer-value">${rec.Telephone_Principal || '-'}</span></div>

        <div class="viewer-field full"><span class="viewer-label">Adresse</span><span class="viewer-value">${rec.Adresse || ''} ${rec.Code_Postal || ''} ${rec.Ville || ''}</span></div>

        <div class="viewer-field"><span class="viewer-label">Domaine d'activités</span><span class="viewer-value">${normaliserChaine(rec.DOMAINE_D_ACTIVITES) || '-'}</span></div>
        <div class="viewer-field"><span class="viewer-label">Diffusion Cinéma</span><span class="viewer-value">${normaliserChaine(rec.Listes_Diffusion_Cinema || rec.Listes_Diffusion_Cin_ma) || '-'}</span></div>

        <div class="viewer-field full"><span class="viewer-label">Description / Commentaire</span><span class="viewer-value">${rec.Commentaire___Description || rec.Commentaire || '-'}</span></div>
      `;
    }

    function naviguer(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < matchingRecords.length) {
        currentIndex = newIndex;
        afficherTableau();
        afficherFicheCourante();
      }
    }

    function reinitialiserFiltres() {
      document.getElementById('filter-text').value = '';
      document.getElementById('filter-service').value = '';
      document.getElementById('filter-statut').value = '';
      document.getElementById('filter-domaine').value = '';

      document.querySelectorAll('.checkbox-group input[type="checkbox"]').forEach(cb => cb.checked = false);

      appliquerFiltres();
    }
  </script>
</body>
</html>
