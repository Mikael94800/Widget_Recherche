<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche & Consultation Contact</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; font-size: 14px; }
    
    .search-card { background: #ffffff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; max-width: 1000px; margin: 0 auto; }
    .card-title { font-size: 18px; font-weight: 700; color: #1f2937; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .search-input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"], textarea { padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; width: 100%; background: #fff; }
    input:focus, textarea:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }

    .results-list { max-height: 250px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 12px; background: #fff; }
    .result-item { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
    .result-item:hover { background-color: #f0f7ff; }
    .result-item:last-child { border-bottom: none; }
    
    .contact-name { font-weight: 600; color: #111827; }
    .contact-details { font-size: 12px; color: #6b7280; }
    .no-results { padding: 12px; text-align: center; color: #9ca3af; font-style: italic; }

    .btn-clear { background: #f3f4f6; border: 1px solid #d1d5db; color: #374151; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-clear:hover { background: #e5e7eb; }

    /* Fenêtre Modale d'Édition / Modification */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(2px); z-index: 1000; justify-content: center; align-items: center; }
    .modal-container { background: #ffffff; border-radius: 12px; max-width: 820px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 22px; border: 1px solid #e5e7eb; }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 16px; }
    .modal-header h3 { margin: 0; font-size: 18px; color: #111827; }
    .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #6b7280; line-height: 1; }
    .close-btn:hover { color: #111827; }

    /* Layout Grille Modale Harmonisé */
    .modal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .modal-grid-full { grid-column: span 2; }
    
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group label { font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }

    .section-divider { grid-column: span 2; font-size: 12px; font-weight: 700; color: #0958d9; background: #e6f4ff; padding: 6px 10px; border-radius: 4px; margin-top: 4px; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; border-top: 1px solid #e5e7eb; padding-top: 14px; }
    .btn-save { background-color: #1677ff; color: white; border: none; padding: 9px 18px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .btn-save:hover { background-color: #0958d9; }
    .btn-cancel { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 9px 18px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .btn-cancel:hover { background-color: #e5e7eb; }
  </style>
</head>
<body>

  <div class="search-card">
    <div class="card-title">
      <span>Moteur de Recherche Contacts</span>
      <button class="btn-clear" onclick="effacerRecherche()">Réinitialiser</button>
    </div>

    <div class="search-input-group">
      <input type="text" id="search-box" placeholder="Rechercher par nom, prénom, structure, email..." oninput="filtrerContacts()">
    </div>

    <div class="results-list" id="results-container">
      <div class="no-results">Tapez au moins un caractère pour lancer la recherche...</div>
    </div>
  </div>

  <!-- Modal de Consultation / Modification -->
  <div class="modal-overlay" id="modal-edition">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Modifier le contact</h3>
        <button class="close-btn" onclick="fermerModal()">&times;</button>
      </div>

      <div class="modal-grid">
        <div class="field-group">
          <label>Nom</label>
          <input type="text" id="edit-nom">
        </div>
        <div class="field-group">
          <label>Prénom</label>
          <input type="text" id="edit-prenom">
        </div>

        <div class="field-group form-grid-full">
          <label>Nom Structure</label>
          <input type="text" id="edit-nom-structure">
        </div>

        <div class="field-group">
          <label>Fonction / Profession</label>
          <input type="text" id="edit-fonction">
        </div>
        <div class="field-group">
          <label>Ville</label>
          <input type="text" id="edit-ville">
        </div>

        <!-- Coordonnées Principales et Secondaires -->
        <div class="section-divider">Coordonnées de communication</div>

        <div class="field-group">
          <label>Email principal</label>
          <input type="text" id="edit-email-principal">
        </div>
        <div class="field-group">
          <label>Emails secondaires</label>
          <input type="text" id="edit-emails-secondaires">
        </div>

        <div class="field-group">
          <label>Téléphone principal</label>
          <input type="text" id="edit-tel-principal">
        </div>
        <div class="field-group">
          <label>Téléphones secondaires</label>
          <input type="text" id="edit-telephones-secondaires">
        </div>

        <div class="field-group modal-grid-full">
          <label>Commentaire / Description</label>
          <textarea id="edit-commentaire" rows="3"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="fermerModal()">Annuler</button>
        <button class="btn-save" onclick="enregistrerModifications()">Enregistrer les modifications</button>
      </div>
    </div>
  </div>

  <script>
    let allRecords = [];
    let currentContactId = null;

    grist.ready({ requiredAccess: 'full' });

    grist.onRecords(function(records) {
      allRecords = records;
    });

    function filtrerContacts() {
      const query = document.getElementById('search-box').value.toLowerCase().trim();
      const container = document.getElementById('results-container');

      if (query === '') {
        container.innerHTML = '<div class="no-results">Tapez au moins un caractère pour lancer la recherche...</div>';
        return;
      }

      const resultats = allRecords.filter(r => {
        const nom = (r.NOM || '').toLowerCase();
        const prenom = (r.PRENOM || '').toLowerCase();
        const structure = (r.NOM_Structure || '').toLowerCase();
        const email = (r.EMAIL_PRINCIPAL || '').toLowerCase();
        const emailsSec = (r.EMAILS_SECONDAIRES || '').toLowerCase();
        const ville = (r.Ville || '').toLowerCase();

        return nom.includes(query) || 
               prenom.includes(query) || 
               structure.includes(query) || 
               email.includes(query) || 
               emailsSec.includes(query) ||
               ville.includes(query);
      });

      if (resultats.length === 0) {
        container.innerHTML = '<div class="no-results">Aucun contact trouvé.</div>';
        return;
      }

      container.innerHTML = resultats.map(r => `
        <div class="result-item" onclick="selectionnerContact(${r.id})" ondblclick="ouvrirModalModification(${r.id})">
          <div>
            <div class="contact-name">${r.NOM ? r.NOM.toUpperCase() : ''} ${r.PRENOM || ''}</div>
            <div class="contact-details">${r.NOM_Structure || 'Aucune structure'} - ${r.Ville || 'Ville non renseignée'}</div>
          </div>
          <div class="contact-details">${r.EMAIL_PRINCIPAL || ''}</div>
        </div>
      `).join('');
    }

    function selectionnerContact(id) {
      // Positionne la sélection de Grist sur la ligne du contact cliqué
      grist.setSelectedRecord(id);
    }

    function ouvrirModalModification(id) {
      const contact = allRecords.find(r => r.id === id);
      if (!contact) return;

      currentContactId = id;

      document.getElementById('edit-nom').value = contact.NOM || '';
      document.getElementById('edit-prenom').value = contact.PRENOM || '';
      document.getElementById('edit-nom-structure').value = contact.NOM_Structure || '';
      document.getElementById('edit-fonction').value = contact.Fonction_Profession || '';
      document.getElementById('edit-ville').value = contact.Ville || '';
      document.getElementById('edit-email-principal').value = contact.EMAIL_PRINCIPAL || '';
      document.getElementById('edit-tel-principal').value = contact.Telephone_Principal || '';
      document.getElementById('edit-commentaire').value = contact.Commentaire_Description || '';

      // Integration exacte des Col IDs de la base de données
      document.getElementById('edit-emails-secondaires').value = contact.EMAILS_SECONDAIRES || '';
      document.getElementById('edit-telephones-secondaires').value = contact.Telephones_Secondaires || '';

      document.getElementById('modal-edition').style.display = 'flex';
    }

    function fermerModal() {
      document.getElementById('modal-edition').style.display = 'none';
      currentContactId = null;
    }

    async function enregistrerModifications() {
      if (!currentContactId) return;

      const donneesMisesAJour = {
        id: currentContactId,
        NOM: document.getElementById('edit-nom').value || null,
        PRENOM: document.getElementById('edit-prenom').value || null,
        NOM_Structure: document.getElementById('edit-nom-structure').value || null,
        Fonction_Profession: document.getElementById('edit-fonction').value || null,
        Ville: document.getElementById('edit-ville').value || null,
        EMAIL_PRINCIPAL: document.getElementById('edit-email-principal').value || null,
        Telephone_Principal: document.getElementById('edit-tel-principal').value || null,
        Commentaire_Description: document.getElementById('edit-commentaire').value || null,

        // Clés envoyées à l'API Grist
        EMAILS_SECONDAIRES: document.getElementById('edit-emails-secondaires').value || null,
        Telephones_Secondaires: document.getElementById('edit-telephones-secondaires').value || null
      };

      try {
        await grist.selectedTable.update([donneesMisesAJour]);
        alert("Modifications enregistrées avec succès !");
        fermerModal();
      } catch (erreur) {
        alert("Erreur lors de la mise à jour : " + erreur.message);
      }
    }

    function effacerRecherche() {
      document.getElementById('search-box').value = '';
      filtrerContacts();
    }
  </script>
</body>
</html>
