<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion Contacts Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; font-size: 15.5px; }
    
    .search-card { background: #ffffff; border-radius: 10px; padding: 20px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 700; color: #1f2937; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .count-badge { background: #e6f4ff; color: #0958d9; font-size: 15.5px; padding: 4px 10px; border-radius: 12px; font-weight: 600; }

    .filter-row, .filter-row-bottom { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    .checkboxes-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }

    .field-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 13.5px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], select, textarea { padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15.5px; outline: none; background-color: #fff; width: 100%; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
    
    input.invalid-email { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    input.valid-email { border-color: #10b981 !important; background-color: #f0fdf4 !important; }
    .email-msg { font-size: 11.5px; margin-top: 2px; font-weight: 600; }
    .email-msg.error { color: #dc2626; }
    .email-msg.success { color: #16a34a; }

    .checkbox-group { border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 11px; background-color: #f9fafb; display: flex; flex-direction: column; gap: 6px; max-height: 120px; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: #374151; cursor: pointer; }

    .actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; align-items: center; }
    .btn-search { background-color: #1677ff; color: white; border: none; padding: 11px 22px; font-size: 16.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-reset { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 11px 19px; font-size: 16.5px; font-weight: 600; border-radius: 6px; cursor: pointer; }

    .table-toolbar { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 11px 14px; border: 1px solid #e5e7eb; border-bottom: none; border-radius: 8px 8px 0 0; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
    .toolbar-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    
    .btn-tool { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 7px 13px; font-size: 15.5px; font-weight: bold; cursor: pointer; color: #374151; }
    .btn-tool:hover { background: #e5e7eb; }
    
    .btn-export { background-color: #10b981; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-csv { background-color: #0284c7; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-copy { background-color: #8b5cf6; color: white; border: none; padding: 9px 15px; font-size: 15.5px; font-weight: bold; border-radius: 6px; cursor: pointer; }

    .table-container { max-height: 65vh; overflow-y: auto; overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 0 0 8px 8px; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 15.5px; text-align: left; table-layout: fixed; }
    th { background-color: #f3f4f6; color: #374151; padding: 13px 11px; position: sticky; top: 0; border-bottom: 1px solid #d1d5db; z-index: 5; }
    td { padding: 12px 11px; border-bottom: 1px solid #f9fafb; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr.result-row { cursor: pointer; }
    tr.result-row:hover { background-color: #f0fdf4; }
    tr.selected { background-color: #e6f4ff !important; }

    .btn-action-modifier { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 4px 10px; font-size: 13.5px; font-weight: bold; border-radius: 4px; cursor: pointer; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
    .modal-card { background: #fff; border-radius: 12px; width: 95%; max-width: 950px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; margin-bottom: 16px; }
    .modal-title { font-size: 20px; font-weight: bold; color: #111827; }
    .btn-close { background: #f3f4f6; border: none; font-size: 20px; font-weight: bold; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; }
    
    .viewer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .viewer-field { display: flex; flex-direction: column; background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; }
    .viewer-field.full { grid-column: span 2; }
    .viewer-label { font-size: 12px; font-weight: bold; color: #6b7280; text-transform: uppercase; margin-bottom: 4px; }
    
    .modal-section-title { grid-column: span 2; font-size: 15px; font-weight: bold; color: #1f2937; margin-top: 10px; padding-bottom: 4px; border-bottom: 2px solid #e5e7eb; }
    .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #e5e7eb; padding-top: 14px; }
  </style>
</head>
<body>

  <div class="search-card">
    <div class="card-title">
      <span>🔍 Recherche Multi-critères</span>
      <span id="result-count" class="count-badge">Chargement...</span>
    </div>

    <div class="filter-row">
      <div class="field-group">
        <label>Recherche Texte</label>
        <input type="text" id="filter-text" placeholder="Nom, prénom, structure, ville, email..." oninput="appliquerFiltres()">
      </div>
      <div class="field-group">
        <label>Service (Origine)</label>
        <select id="filter-service" onchange="appliquerFiltres()"><option value="">-- Tous --</option></select>
      </div>
      <div class="field-group">
        <label>Statut Juridique</label>
        <select id="filter-statut" onchange="appliquerFiltres()"><option value="">-- Tous --</option></select>
      </div>
    </div>

    <div class="filter-row-bottom">
      <div class="field-group">
        <label>Type de structure</label>
        <select id="filter-type-structure" onchange="appliquerFiltres()"><option value="">-- Tous --</option></select>
      </div>
      <div class="field-group">
        <label>Fonction / Profession</label>
        <input type="text" id="filter-fonction" placeholder="Filtrer..." oninput="appliquerFiltres()">
      </div>
      <div class="field-group">
        <label>Domaine d'activités</label>
        <select id="filter-domaine" onchange="appliquerFiltres()"><option value="">-- Tous --</option></select>
      </div>
    </div>

    <div class="checkboxes-container">
      <div class="field-group">
        <label>Diffusion Cinéma</label>
        <div class="checkbox-group" id="group-cinema">
          <label class="checkbox-item"><input type="checkbox" value="Crèche" onchange="appliquerFiltres()"> Crèche</label>
          <label class="checkbox-item"><input type="checkbox" value="Enfance & Jeunesse" onchange="appliquerFiltres()"> Enfance & Jeunesse</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant élémentaire" onchange="appliquerFiltres()"> Enseignant élémentaire</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant maternelle" onchange="appliquerFiltres()"> Enseignant maternelle</label>
        </div>
      </div>
      <div class="field-group">
        <label>Diffusion Direction</label>
        <div class="checkbox-group" id="group-direction">
          <label class="checkbox-item"><input type="checkbox" value="Enseignants maternelle PEAC 26-27" onchange="appliquerFiltres()"> PEAC Maternelle</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignants élémentaire PEAC 26-27" onchange="appliquerFiltres()"> PEAC Élémentaire</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts visuels" onchange="appliquerFiltres()"> Arts visuels</label>
          <label class="checkbox-item"><input type="checkbox" value="Newsletter" onchange="appliquerFiltres()"> Newsletter</label>
        </div>
      </div>
      <div class="field-group">
        <label>Diffusion Houdremont</label>
        <div class="checkbox-group" id="group-houdremont">
          <label class="checkbox-item"><input type="checkbox" value="Crèche" onchange="appliquerFiltres()"> Crèche</label>
          <label class="checkbox-item"><input type="checkbox" value="Habitants" onchange="appliquerFiltres()"> Habitants</label>
          <label class="checkbox-item"><input type="checkbox" value="Newsletter" onchange="appliquerFiltres()"> Newsletter</label>
        </div>
      </div>
      <div class="field-group">
        <label>Diffusion Intervenant</label>
        <div class="checkbox-group" id="group-intervenant">
          <label class="checkbox-item"><input type="checkbox" value="Cinéma" onchange="appliquerFiltres()"> Cinéma</label>
          <label class="checkbox-item"><input type="checkbox" value="PEAC 26-27" onchange="appliquerFiltres()"> PEAC 26-27</label>
          <label class="checkbox-item"><input type="checkbox" value="Patrimoine" onchange="appliquerFiltres()"> Patrimoine</label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-reset" onclick="reinitialiserFiltres()">Réinitialiser</button>
      <button class="btn-search" onclick="appliquerFiltres()">Rechercher</button>
    </div>
  </div>

  <div class="table-toolbar">
    <div class="toolbar-group">
      <button class="btn-tool" onclick="naviguerTableau(-1)">▲ Précédent</button>
      <button class="btn-tool" onclick="naviguerTableau(1)">▼ Suivant</button>
    </div>
    <div class="toolbar-group">
      <button class="btn-copy" onclick="copierEmails()">📋 Copier les emails</button>
    </div>
  </div>

  <div class="table-container">
    <table id="main-table">
      <thead>
        <tr>
          <th>Nom</th><th>Prénom</th><th>Structure</th><th>Service</th><th>Ville</th><th>Email</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="results-table-body"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="fermerModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">Modifier la fiche contact</span>
        <button class="btn-close" onclick="fermerModal()">×</button>
      </div>
      <div class="viewer-grid" id="modal-content"></div>
      <div class="modal-footer">
        <button class="btn-reset" onclick="fermerModal()">Annuler</button>
        <button class="btn-search" onclick="sauvegarderContactModifie()">Enregistrer les modifications</button>
      </div>
    </div>
  </div>

  <script>
    let allRecords = [];
    let matchingRecords = [];
    let selectedIndex = 0;
    let currentEditingRecord = null;

    // Définition tolérante des alias des colonnes
    const ALIASES = {
      NOM: ['NOM', 'Nom'],
      PRENOM: ['PRENOM', 'Prénom', 'Prenom'],
      STRUCTURE: ['NOM_Structure', 'NOM Structure', 'Structure', 'Structure_Contact', 'Nom_Structure'],
      FONCTION: ['Fonction_Profession', 'Fonction / Profession', 'Fonction', 'Fonction_ou_Profession'],
      SERVICE: ['Service', 'Service_Origine', 'Service (Origine)', 'SERVICE'],
      STATUT: ['STATUT_JURIDIQUE', 'Statut Juridique', 'Statut_Juridique', 'Statut'],
      CODE_POSTAL: ['Code_Postal', 'Code Postal', 'CP', 'CodePostal'],
      VILLE: ['Ville', 'VILLE', 'Commune'],
      EMAIL_PRINCIPAL: ['EMAIL_PRINCIPAL', 'Email Principal', 'Email', 'Email_Principal'],
      EMAILS_SECONDAIRES: ['EMAILS_SECONDAIRES', 'Emails Secondaires', 'Emails_Secondaires'],
      TEL_PRINCIPAL: ['Telephone_Principal', 'Téléphone Principal', 'Telephone Principal', 'Tel_Principal'],
      TELS_SECONDAIRES: ['Telephones_Secondaires', 'Téléphones Secondaires', 'Telephones_Secondaires'],
      DIFF_CINEMA: ['Listes_Diffusion_Cinema', 'Listes Diffusion Cinéma', 'Diffusion Cinéma', 'Diffusion_Cinema', 'Listes_Diffusion_Cinéma'],
      DIFF_DIRECTION: ['Listes_Diffusion_Direction', 'Listes Diffusion Direction', 'Diffusion Direction', 'Diffusion_Direction'],
      DIFF_HOUDREMONT: ['Listes_Diffusion_Houdremont', 'Listes Diffusion Houdremont', 'Diffusion Houdremont', 'Diffusion_Houdremont'],
      DIFF_INTERVENANT: ['Listes_Diffusion_Intervenant', 'Listes Diffusion Intervenant', 'Diffusion Intervenant', 'Diffusion_Intervenant'],
      COMMENTAIRE: ['Commentaire_Description', 'Commentaire / Description', 'Commentaire', 'Description']
    };

    grist.ready({ requiredAccess: 'full' });

    grist.onRecords(function(records) {
      allRecords = records;
      peuplerListesDeroulantesFiltres();
      appliquerFiltres();
    });

    // Extraction robuste de la clé exacte présente dans la donnée Grist
    function findKey(rec, aliasList) {
      if (!rec) return aliasList[0];
      for (let k of aliasList) {
        if (k in rec) return k;
      }
      return aliasList[0];
    }

    function getVal(rec, aliasList) {
      if (!rec) return "";
      for (let k of aliasList) {
        if (rec[k] !== undefined && rec[k] !== null) return rec[k];
      }
      return "";
    }

    function normaliserChaine(valeur) {
      if (!valeur) return "";
      if (typeof valeur === "string") return valeur;
      if (Array.isArray(valeur)) {
        return valeur.map(v => (typeof v === 'object' && v !== null && v.L) ? v.L : (typeof v === 'object' ? JSON.stringify(v) : String(v))).join(", ");
      }
      if (typeof valeur === "object") return valeur.L || JSON.stringify(valeur);
      return String(valeur);
    }

    function contientCritere(champData, valeurRecherchee) {
      return normaliserChaine(champData).toLowerCase().includes(valeurRecherchee.toLowerCase());
    }

    function extraireValeursUniques(aliasList) {
      const valeursSet = new Set();
      allRecords.forEach(r => {
        const val = getVal(r, aliasList);
        if (val) {
          normaliserChaine(val).split(/[,;]/).forEach(v => {
            const clean = v.trim();
            if (clean) valeursSet.add(clean);
          });
        }
      });
      return Array.from(valeursSet).sort();
    }

    function peuplerListesDeroulantesFiltres() {
      const alimenter = (id, alias) => {
        const sel = document.getElementById(id);
        const valActuelle = sel.value;
        const options = extraireValeursUniques(alias);
        sel.innerHTML = '<option value="">-- Tous --</option>' + options.map(s => `<option value="${s}">${s}</option>`).join('');
        sel.value = valActuelle;
      };
      alimenter('filter-service', ALIASES.SERVICE);
      alimenter('filter-statut', ALIASES.STATUT);
    }

    function appliquerFiltres() {
      if (!allRecords.length) return;
      const textFilter = document.getElementById('filter-text').value.toLowerCase().trim();
      const serviceFilter = document.getElementById('filter-service').value;
      const statutFilter = document.getElementById('filter-statut').value;

      matchingRecords = allRecords.filter(rec => {
        if (textFilter) {
          const texteGlobal = [
            getVal(rec, ALIASES.NOM), getVal(rec, ALIASES.PRENOM), getVal(rec, ALIASES.STRUCTURE),
            getVal(rec, ALIASES.VILLE), getVal(rec, ALIASES.EMAIL_PRINCIPAL)
          ].map(c => normaliserChaine(c)).join(' ').toLowerCase();
          if (!textFilter.split(/\s+/).every(mot => texteGlobal.includes(mot))) return false;
        }
        if (serviceFilter && !contientCritere(getVal(rec, ALIASES.SERVICE), serviceFilter)) return false;
        if (statutFilter && !contientCritere(getVal(rec, ALIASES.STATUT), statutFilter)) return false;
        return true;
      });

      document.getElementById('result-count').innerText = `${matchingRecords.length} / ${allRecords.length} résultat(s)`;
      afficherTableau();
    }

    function reinitialiserFiltres() {
      document.getElementById('filter-text').value = '';
      document.getElementById('filter-service').value = '';
      document.getElementById('filter-statut').value = '';
      appliquerFiltres();
    }

    function afficherTableau() {
      const tbody = document.getElementById('results-table-body');
      tbody.innerHTML = '';
      matchingRecords.forEach((rec, index) => {
        const tr = document.createElement('tr');
        tr.className = 'result-row';
        if (index === selectedIndex) tr.classList.add('selected');

        tr.innerHTML = `
          <td>${getVal(rec, ALIASES.NOM)}</td>
          <td>${getVal(rec, ALIASES.PRENOM)}</td>
          <td>${getVal(rec, ALIASES.STRUCTURE)}</td>
          <td>${normaliserChaine(getVal(rec, ALIASES.SERVICE))}</td>
          <td>${getVal(rec, ALIASES.VILLE)}</td>
          <td>${getVal(rec, ALIASES.EMAIL_PRINCIPAL)}</td>
          <td><button class="btn-action-modifier">Modifier</button></td>
        `;

        tr.querySelector('.btn-action-modifier').onclick = (e) => {
          e.stopPropagation();
          ouvrirModal(rec);
        };
        tbody.appendChild(tr);
      });
    }

    /* MODALE DE MODIFICATION AVEC SÉCURISATION DES RÉFÉRENCES, VILLE AUTO & EMAILS */
    function ouvrirModal(rec) {
      currentEditingRecord = rec;
      const container = document.getElementById('modal-content');

      container.innerHTML = `
        <div class="modal-section-title">👤 Identité & Structure</div>
        <div class="viewer-field"><span class="viewer-label">Nom</span><input type="text" id="edit-nom" value="${getVal(rec, ALIASES.NOM)}"></div>
        <div class="viewer-field"><span class="viewer-label">Prénom</span><input type="text" id="edit-prenom" value="${getVal(rec, ALIASES.PRENOM)}"></div>
        <div class="viewer-field"><span class="viewer-label">Structure</span><input type="text" id="edit-structure" value="${getVal(rec, ALIASES.STRUCTURE)}"></div>
        <div class="viewer-field"><span class="viewer-label">Fonction</span><input type="text" id="edit-fonction" value="${getVal(rec, ALIASES.FONCTION)}"></div>
        <div class="viewer-field"><span class="viewer-label">Service</span><input type="text" id="edit-service" value="${normaliserChaine(getVal(rec, ALIASES.SERVICE))}"></div>
        <div class="viewer-field"><span class="viewer-label">Statut Juridique</span><input type="text" id="edit-statut" value="${normaliserChaine(getVal(rec, ALIASES.STATUT))}"></div>

        <div class="modal-section-title">📍 Adresse & Coordonnées</div>
        <div class="viewer-field">
          <span class="viewer-label">Code Postal</span>
          <input type="text" id="edit-code-postal" value="${getVal(rec, ALIASES.CODE_POSTAL)}" oninput="chercherVilleParCodePostal(this.value)">
        </div>
        <div class="viewer-field">
          <span class="viewer-label">Ville</span>
          <input type="text" id="edit-ville" value="${getVal(rec, ALIASES.VILLE)}">
        </div>
        <div class="viewer-field">
          <span class="viewer-label">Email Principal</span>
          <input type="text" id="edit-email-principal" value="${getVal(rec, ALIASES.EMAIL_PRINCIPAL)}" oninput="validerEmailTerrain('edit-email-principal', 'msg-email-principal', false)">
          <div id="msg-email-principal" class="email-msg"></div>
        </div>
        <div class="viewer-field">
          <span class="viewer-label">Emails Secondaires</span>
          <input type="text" id="edit-emails-secondaires" value="${getVal(rec, ALIASES.EMAILS_SECONDAIRES)}" oninput="validerEmailTerrain('edit-emails-secondaires', 'msg-emails-secondaires', true)">
          <div id="msg-emails-secondaires" class="email-msg"></div>
        </div>
        <div class="viewer-field"><span class="viewer-label">Tél. Principal</span><input type="text" id="edit-tel-principal" value="${getVal(rec, ALIASES.TEL_PRINCIPAL)}"></div>
        <div class="viewer-field"><span class="viewer-label">Tél. Secondaires</span><input type="text" id="edit-tels-secondaires" value="${getVal(rec, ALIASES.TELS_SECONDAIRES)}"></div>

        <div class="modal-section-title">📢 Listes de Diffusion</div>
        <div class="viewer-field"><span class="viewer-label">Diffusion Cinéma</span><input type="text" id="edit-diff-cinema" value="${normaliserChaine(getVal(rec, ALIASES.DIFF_CINEMA))}"></div>
        <div class="viewer-field"><span class="viewer-label">Diffusion Direction</span><input type="text" id="edit-diff-direction" value="${normaliserChaine(getVal(rec, ALIASES.DIFF_DIRECTION))}"></div>
        <div class="viewer-field"><span class="viewer-label">Diffusion Houdremont</span><input type="text" id="edit-diff-houdremont" value="${normaliserChaine(getVal(rec, ALIASES.DIFF_HOUDREMONT))}"></div>
        <div class="viewer-field"><span class="viewer-label">Diffusion Intervenant</span><input type="text" id="edit-diff-intervenant" value="${normaliserChaine(getVal(rec, ALIASES.DIFF_INTERVENANT))}"></div>

        <div class="modal-section-title">📝 Remarques</div>
        <div class="viewer-field full"><span class="viewer-label">Commentaire</span><textarea id="edit-commentaire" rows="3">${getVal(rec, ALIASES.COMMENTAIRE)}</textarea></div>
      `;

      document.getElementById('modal-overlay').style.display = 'flex';
      validerEmailTerrain('edit-email-principal', 'msg-email-principal', false);
      validerEmailTerrain('edit-emails-secondaires', 'msg-emails-secondaires', true);
    }

    // Auto-complétion automatique de la Ville via l'API Adresse
    async function chercherVilleParCodePostal(cp) {
      const codePropre = cp.trim();
      if (/^\d{5}$/.test(codePropre)) {
        try {
          const res = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${codePropre}&type=municipality&limit=1`);
          const data = await res.json();
          if (data.features && data.features.length > 0) {
            document.getElementById('edit-ville').value = data.features[0].properties.city;
          }
        } catch (e) {
          console.error("Erreur de récupération de la ville:", e);
        }
      }
    }

    // Validation syntaxique des emails
    function validerEmailTerrain(inputId, msgId, autoriserMultiple) {
      const input = document.getElementById(inputId);
      const msg = document.getElementById(msgId);
      const val = input.value.trim();

      if (!val) {
        input.className = '';
        msg.innerText = '';
        return true;
      }

      const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      let estValide = true;

      if (autoriserMultiple) {
        const emails = val.split(/[,;]/).map(e => e.trim()).filter(e => e !== '');
        estValide = emails.every(e => regexEmail.test(e));
      } else {
        estValide = regexEmail.test(val);
      }

      if (estValide) {
        input.className = 'valid-email';
        msg.className = 'email-msg success';
        msg.innerText = '✓ Format email valide';
      } else {
        input.className = 'invalid-email';
        msg.className = 'email-msg error';
        msg.innerText = '✕ Adresse email invalide';
      }
      return estValide;
    }

    function fermerModal(event) {
      if (event && event.target !== document.getElementById('modal-overlay') && !event.target.classList.contains('btn-close') && !event.target.classList.contains('btn-reset')) return;
      document.getElementById('modal-overlay').style.display = 'none';
      currentEditingRecord = null;
    }

    // Sauvegarde en résolvant dynamiquement le vrai nom des colonnes du tableau
    async function sauvegarderContactModifie() {
      if (!currentEditingRecord) return;

      const r = currentEditingRecord;
      const updatedFields = {};

      updatedFields[findKey(r, ALIASES.NOM)] = document.getElementById('edit-nom').value;
      updatedFields[findKey(r, ALIASES.PRENOM)] = document.getElementById('edit-prenom').value;
      updatedFields[findKey(r, ALIASES.STRUCTURE)] = document.getElementById('edit-structure').value;
      updatedFields[findKey(r, ALIASES.FONCTION)] = document.getElementById('edit-fonction').value;
      updatedFields[findKey(r, ALIASES.SERVICE)] = document.getElementById('edit-service').value;
      updatedFields[findKey(r, ALIASES.STATUT)] = document.getElementById('edit-statut').value;
      updatedFields[findKey(r, ALIASES.CODE_POSTAL)] = document.getElementById('edit-code-postal').value;
      updatedFields[findKey(r, ALIASES.VILLE)] = document.getElementById('edit-ville').value;
      updatedFields[findKey(r, ALIASES.EMAIL_PRINCIPAL)] = document.getElementById('edit-email-principal').value;
      updatedFields[findKey(r, ALIASES.EMAILS_SECONDAIRES)] = document.getElementById('edit-emails-secondaires').value;
      updatedFields[findKey(r, ALIASES.TEL_PRINCIPAL)] = document.getElementById('edit-tel-principal').value;
      updatedFields[findKey(r, ALIASES.TELS_SECONDAIRES)] = document.getElementById('edit-tels-secondaires').value;
      updatedFields[findKey(r, ALIASES.COMMENTAIRE)] = document.getElementById('edit-commentaire').value;

      updatedFields[findKey(r, ALIASES.DIFF_CINEMA)] = document.getElementById('edit-diff-cinema').value;
      updatedFields[findKey(r, ALIASES.DIFF_DIRECTION)] = document.getElementById('edit-diff-direction').value;
      updatedFields[findKey(r, ALIASES.DIFF_HOUDREMONT)] = document.getElementById('edit-diff-houdremont').value;
      updatedFields[findKey(r, ALIASES.DIFF_INTERVENANT)] = document.getElementById('edit-diff-intervenant').value;

      try {
        await grist.docApi.applyUserActions([
          ['UpdateRecord', 'CONTACTS', currentEditingRecord.id, updatedFields]
        ]);
        document.getElementById('modal-overlay').style.display = 'none';
        currentEditingRecord = null;
      } catch (err) {
        alert("Erreur lors de la mise à jour : " + err.message);
      }
    }

    function copierEmails() {
      const emails = matchingRecords.map(r => getVal(r, ALIASES.EMAIL_PRINCIPAL)).filter(e => e && e.trim() !== '').join('; ');
      if (!emails) return alert('Aucun email disponible.');
      navigator.clipboard.writeText(emails).then(() => alert(`${matchingRecords.length} email(s) copié(s).`));
    }

    function naviguerTableau(dir) {
      if (!matchingRecords.length) return;
      selectedIndex = Math.max(0, Math.min(matchingRecords.length - 1, selectedIndex + dir));
      afficherTableau();
    }
  </script>
