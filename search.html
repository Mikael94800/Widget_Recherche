<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Saisie d'un Nouveau Contact</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f8fafc; font-size: 15.5px; }
    
    .form-card { background: #ffffff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; max-width: 1000px; margin: 0 auto; }
    .card-title { font-size: 20px; font-weight: 700; color: #1f2937; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; }
    .id-badge { background: #e6f4ff; color: #0958d9; font-size: 14px; padding: 4px 10px; border-radius: 12px; font-weight: 600; }

    .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 14px; }
    .form-row-1 { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 14px; }

    .field-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 13px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], select, textarea { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; outline: none; background-color: #fff; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
    
    .checkboxes-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 14px; background: #f9fafb; padding: 14px; border-radius: 8px; border: 1px solid #e5e7eb; }
    .checkbox-group { border: 1px solid #d1d5db; border-radius: 6px; padding: 10px; background-color: #fff; display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #374151; cursor: pointer; text-transform: none; font-weight: normal; }
    .checkbox-item input[type="checkbox"] { transform: scale(1.1); cursor: pointer; }

    .section-subtitle { font-size: 15px; font-weight: bold; color: #1e293b; margin: 18px 0 10px 0; border-left: 4px solid #1677ff; padding-left: 8px; }

    .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
    .btn-submit { background-color: #52c41a; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn-submit:hover { background-color: #389e0d; }

    .error-input { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    .error-msg { font-size: 12px; color: #ef4444; margin-top: 3px; display: none; }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="card-title">
      <span>Saisie d'un Nouveau Contact</span>
      <span id="ligne-id" class="id-badge">Nouvelle fiche</span>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label>Date de saisie</label>
        <input type="text" id="input-date" readonly style="background-color: #f3f4f6;">
      </div>
      <div class="field-group">
        <label>Service (Origine)</label>
        <select id="input-service">
          <option value="">-- Sélectionner --</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label>Statut Juridique</label>
        <select id="input-statut">
          <option value="">-- Sélectionner --</option>
        </select>
      </div>
      <div class="field-group">
        <label>Type de structure / Contact</label>
        <select id="input-type-structure">
          <option value="">-- Sélectionner --</option>
        </select>
      </div>
    </div>

    <div class="form-row-1">
      <div class="field-group">
        <label>Domaine d'activités</label>
        <select id="input-domaine">
          <option value="">-- Sélectionner --</option>
        </select>
      </div>
    </div>

    <div class="form-row-1">
      <div class="field-group">
        <label>Nom structure</label>
        <input type="text" id="input-nom-structure" placeholder="Nom de la structure">
      </div>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label>Nom</label>
        <input type="text" id="input-nom" placeholder="Nom de famille">
      </div>
      <div class="field-group">
        <label>Prénom</label>
        <input type="text" id="input-prenom" placeholder="Prénom">
      </div>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label>Email principal</label>
        <input type="text" id="input-email" placeholder="exemple@domaine.fr" oninput="validerEmail(this)">
        <div class="error-msg" id="err-email">Format d'e-mail invalide</div>
      </div>
      <div class="field-group">
        <label>Téléphone principal</label>
        <input type="text" id="input-tel" placeholder="01 23 45 67 89">
      </div>
    </div>

    <div class="form-row-1">
      <div class="field-group">
        <label>Fonction / Profession</label>
        <input type="text" id="input-fonction" placeholder="ex: Responsable...">
      </div>
    </div>

    <div class="form-row-1">
      <div class="field-group">
        <label>Adresse</label>
        <input type="text" id="input-adresse" placeholder="Voie, numéro...">
      </div>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label>Code Postal</label>
        <input type="text" id="input-cp" placeholder="93300">
      </div>
      <div class="field-group">
        <label>Ville</label>
        <input type="text" id="input-ville" placeholder="La Courneuve">
      </div>
    </div>

    <div class="form-row-1">
      <div class="field-group">
        <label>Pays</label>
        <input type="text" id="input-pays" value="France">
      </div>
    </div>

    <!-- Listes de Diffusion -->
    <div class="section-subtitle">Listes de Diffusion</div>
    <div class="checkboxes-container">
      <div class="field-group">
        <label>Diffusion Cinéma</label>
        <div class="checkbox-group" id="group-cinema">
          <label class="checkbox-item"><input type="checkbox" value="Crèche"> Crèche</label>
          <label class="checkbox-item"><input type="checkbox" value="Enfance & Jeunesse"> Enfance & Jeunesse</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant élémentaire"> Enseignant élémentaire</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant maternelle"> Enseignant maternelle</label>
        </div>
      </div>

      <div class="field-group">
        <label>Diffusion Direction</label>
        <div class="checkbox-group" id="group-direction">
          <label class="checkbox-item"><input type="checkbox" value="Enseignants maternelle PEAC 26-27"> Enseignants maternelle PEAC 26-27</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignants élémentaire PEAC 26-27"> Enseignants élémentaire PEAC 26-27</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts visuels"> Arts visuels</label>
          <label class="checkbox-item"><input type="checkbox" value="Patrimoine & Archives"> Patrimoine & Archives</label>
          <label class="checkbox-item"><input type="checkbox" value="Newsletter"> Newsletter</label>
          <label class="checkbox-item"><input type="checkbox" value="DAC_93"> DAC_93</label>
        </div>
      </div>

      <div class="field-group">
        <label>Diffusion Houdremont</label>
        <div class="checkbox-group" id="group-houdremont">
          <label class="checkbox-item"><input type="checkbox" value="Crèche"> Crèche</label>
          <label class="checkbox-item"><input type="checkbox" value="Enfance & Jeunesse"> Enfance & Jeunesse</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant élémentaire"> Enseignant élémentaire</label>
          <label class="checkbox-item"><input type="checkbox" value="Enseignant maternelle"> Enseignant maternelle</label>
          <label class="checkbox-item"><input type="checkbox" value="Habitants"> Habitants</label>
          <label class="checkbox-item"><input type="checkbox" value="Newsletter"> Newsletter</label>
        </div>
      </div>

      <div class="field-group">
        <label>Diffusion Intervenant</label>
        <div class="checkbox-group" id="group-intervenant">
          <label class="checkbox-item"><input type="checkbox" value="Cinéma"> Cinéma</label>
          <label class="checkbox-item"><input type="checkbox" value="PEAC 26-27"> PEAC 26-27</label>
          <label class="checkbox-item"><input type="checkbox" value="Patrimoine"> Patrimoine</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts visuels"> Arts visuels</label>
          <label class="checkbox-item"><input type="checkbox" value="Direction"> Direction</label>
          <label class="checkbox-item"><input type="checkbox" value="Arts plastiques"> Arts plastiques</label>
        </div>
      </div>
    </div>

    <div class="form-row-1">
      <div class="field-group">
        <label>Commentaire / Description</label>
        <textarea id="input-commentaire" rows="3"></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn-submit" onclick="enregistrerNouveauContact()">✓ Valider et terminer la fiche</button>
    </div>
  </div>

  <script>
    let allRecords = [];
    let etiquettesRecords = [];

    grist.ready({ requiredAccess: 'full' });

    // Charger les enregistrements de la table Contacts courante
    grist.onRecords(function(records) {
      allRecords = records;
      remplirListesDeroulantes();
    });

    // Charger aussi la table ETIQUETTES pour faire le lien des IDs de référence
    async function chargerEtiquettes() {
      try {
        const tableEtiquettes = grist.docApi.getTable('ETIQUETTES');
        etiquettesRecords = await tableEtiquettes.fetch();
      } catch (e) {
        console.warn("Impossible de charger la table ETIQUETTES automatiquement :", e);
      }
    }
    chargerEtiquettes();

    const aujourdHui = new Date().toLocaleDateString('fr-FR');
    document.getElementById('input-date').value = aujourdHui;

    function normaliserChaine(valeur) {
      if (!valeur) return "";
      if (typeof valeur === "string") return valeur;
      if (Array.isArray(valeur)) {
        return valeur.map(v => typeof v === 'object' ? JSON.stringify(v) : String(v)).join(", ");
      }
      return String(valeur);
    }

    function extraireValeursUniques(cle) {
      const valeursSet = new Set();
      allRecords.forEach(r => {
        const val = r[cle];
        if (val !== undefined && val !== null && val !== "") {
          const texte = normaliserChaine(val);
          texte.split(/[,;]/).forEach(v => {
            const clean = v.trim();
            if (clean) valeursSet.add(clean);
          });
        }
      });
      return Array.from(valeursSet).sort();
    }

    function remplirSelect(idElement, valeurs) {
      const select = document.getElementById(idElement);
      const valActuelle = select.value;
      select.innerHTML = '<option value="">-- Sélectionner --</option>' + valeurs.map(v => `<option value="${v}">${v}</option>`).join('');
      select.value = valActuelle;
    }

    function remplirListesDeroulantes() {
      remplirSelect('input-service', extraireValeursUniques('Service'));
      remplirSelect('input-statut', extraireValeursUniques('STATUT_JURIDIQUE'));
      
      const typesStruct = extraireValeursUniques('TYPE_DE_STRUCTURE_CONTACT').length > 0 ? 
                          extraireValeursUniques('TYPE_DE_STRUCTURE_CONTACT') : 
                          extraireValeursUniques('TYPE_DE_STRUCTURE');
      remplirSelect('input-type-structure', typesStruct);
      remplirSelect('input-domaine', extraireValeursUniques('DOMAINE_D_ACTIVITES'));
    }

    function estEmailValide(email) {
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return regex.test(email);
    }

    function validerEmail(input) {
      const val = input.value.trim();
      const errDiv = document.getElementById('err-email');
      if (val !== "" && !estEmailValide(val)) {
        input.classList.add('error-input');
        errDiv.style.display = 'block';
        return false;
      } else {
        input.classList.remove('error-input');
        errDiv.style.display = 'none';
        return true;
      }
    }

    function convertirValeurReference(valeurBrute) {
      if (!valeurBrute) return null;
      if (!isNaN(valeurBrute) && valeurBrute.trim() !== "") {
        return Number(valeurBrute);
      }
      return valeurBrute;
    }

    // Convertit les textes cochés en un tableau d'IDs Grist en se basant sur la table ETIQUETTES
    function recupererIdsEtiquettes(idConteneur, nomColonneEtiquettes) {
      const checkboxes = document.querySelectorAll(`#${idConteneur} input[type="checkbox"]:checked`);
      const textesCoches = Array.from(checkboxes).map(cb => cb.value);
      
      if (textesCoches.length === 0) return null;

      // Si la table ETIQUETTES a pu être chargée, on extrait les identifiants (IDs) correspondants
      if (etiquettesRecords && etiquettesRecords.length > 0) {
        const ids = [];
        textesCoches.forEach(texte => {
          const ligneTrouvee = etiquettesRecords.find(row => row[nomColonneEtiquettes] === texte);
          if (ligneTrouvee && ligneTrouvee.id) {
            ids.push(ligneTrouvee.id);
          }
        });
        return ids.length > 0 ? ids : null;
      }

      // Fallback si la table n'a pas pu être interrogée
      return null;
    }

    async function enregistrerNouveauContact() {
      const emailInput = document.getElementById('input-email');
      if (emailInput.value.trim() !== "" && !estEmailValide(emailInput.value.trim())) {
        alert("Veuillez corriger l'adresse e-mail avant de valider.");
        return;
      }

      const timestampActuel = Math.floor(Date.now() / 1000);

      const nouveauContact = {
        DATE_ENTREE_CONTACTS: timestampActuel,
        Service: convertirValeurReference(document.getElementById('input-service').value),
        STATUT_JURIDIQUE: convertirValeurReference(document.getElementById('input-statut').value),
        TYPE_DE_STRUCTURE_CONTACT: convertirValeurReference(document.getElementById('input-type-structure').value),
        DOMAINE_D_ACTIVITES: convertirValeurReference(document.getElementById('input-domaine').value),
        NOM_Structure: document.getElementById('input-nom-structure').value || null,
        NOM: document.getElementById('input-nom').value || null,
        PRENOM: document.getElementById('input-prenom').value || null,
        EMAIL_PRINCIPAL: emailInput.value.trim() || null,
        Telephone_Principal: document.getElementById('input-tel').value || null,
        Fonction_Profession: document.getElementById('input-fonction').value || null,
        Adresse: document.getElementById('input-adresse').value || null,
        Code_Postal: document.getElementById('input-cp').value || null,
        Ville: document.getElementById('input-ville').value || null,
        Pays: document.getElementById('input-pays').value || 'France',
        Commentaire_Description: document.getElementById('input-commentaire').value || null,
        
        // Association propre via les IDs de la table ETIQUETTES pour respecter la Référence multiple
        'Listes_Diffusion_Cinéma': recupererIdsEtiquettes('group-cinema', 'Listes_Diffusion_Cinéma'),
        'Listes_Diffusion_Direction': recupererIdsEtiquettes('group-direction', 'Listes_Diffusion_Direction'),
        'Listes_Diffusion_Houdremont': recupererIdsEtiquettes('group-houdremont', 'Listes_Diffusion_Houdremont'),
        'Listes_Diffusion_Intervenant': recupererIdsEtiquettes('group-intervenant', 'Listes_Diffusion_Intervenant')
      };

      try {
        await grist.selectedTable.create([nouveauContact]);
        alert("Nouveau contact enregistré avec succès !");
        reinitialiserFormulaire();
      } catch (err) {
        alert("Erreur lors de l'enregistrement : " + err.message);
      }
    }

    function reinitialiserFormulaire() {
      document.querySelectorAll('input[type="text"]').forEach(input => {
        if (input.id !== 'input-date' && input.id !== 'input-pays') input.value = '';
      });
      document.querySelectorAll('select').forEach(sel => sel.value = '');
      document.querySelectorAll('textarea').forEach(ta => ta.value = '');
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
      document.getElementById('input-pays').value = 'France';
    }
  </script>
</body>
</html>
